<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rs500.html</title>
<style>
:root{
  --ink:#141210;
  --paper:#1c1915;
  --paper-raised:#242019;
  --paper-line:#332e26;
  --cream:#ece4d3;
  --dust:#8f8676;
  --dust-dim:#5e574a;
  --signal:#e3b23c;
  --signal-dim:#7a6733;
  --radius:3px;
  --font-display:Georgia, 'Times New Roman', serif;
  --font-body:Verdana, Arial, Helvetica, sans-serif;
  --font-mono:'Courier New', Consolas, monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scrollbar-color: var(--paper-line) var(--ink);}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:var(--font-body);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--signal); color:var(--ink);}

/* subtle grain/vignette on the whole page */
body::before{
  content:"";
  position:fixed; inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(227,178,60,0.05), transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(0,0,0,0.4), transparent 60%);
}

/* Fixed background layer: a mosaic tiled from the actual album covers (falls
   back to a genre-colored tile for anything without a real cover yet), with
   a dark overlay on top so text stays readable. */
#bgMosaic{
  position:fixed; inset:0; z-index:-2;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(110px,1fr));
  grid-auto-rows:110px;
}
#bgMosaic .tile{
  width:100%; height:100%;
  background-size:cover; background-position:center;
  filter:saturate(0.6) brightness(0.45);
}
#bgOverlay{
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    linear-gradient(180deg, rgba(14,12,10,0.88) 0%, rgba(14,12,10,0.94) 45%, var(--ink) 88%);
}

a{color:inherit;}
button{font-family:inherit; cursor:pointer;}

.wrap{max-width:1400px; margin:0 auto; padding:0 28px;}

/* ===== HEADER ===== */
header.top{
  position:sticky; top:0; z-index:40;
  background:var(--ink);
  border-bottom:1px solid var(--paper-line);
}
.top-inner{
  display:flex; align-items:center; justify-content:space-between;
  padding:20px 0 16px;
  gap:24px;
  flex-wrap:wrap;
}
.brand{display:flex; align-items:baseline; gap:12px;}
.brand .mark{
  width:34px; height:34px;
  border-radius:50%;
  background:
    radial-gradient(circle at 50% 50%, var(--ink) 0 4px, transparent 5px),
    repeating-radial-gradient(circle at 50% 50%, var(--dust-dim) 0 1px, transparent 1px 4px);
  border:1px solid var(--paper-line);
  flex-shrink:0;
}
.brand h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:22px;
  letter-spacing:0.01em;
}
.brand .sub{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--dust);
  text-transform:uppercase;
  letter-spacing:0.12em;
}

.controls{display:flex; align-items:center; gap:10px; flex-wrap:wrap;}

.search-box{
  position:relative;
}
.search-box input{
  background:var(--paper);
  border:1px solid var(--paper-line);
  color:var(--cream);
  border-radius:var(--radius);
  padding:9px 12px 9px 32px;
  font-family:var(--font-body);
  font-size:13px;
  width:220px;
  outline:none;
  transition:border-color .15s;
}
.search-box input:focus{border-color:var(--signal-dim);}
.search-box svg{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; color:var(--dust);
}

select.sortsel{
  background:var(--paper);
  border:1px solid var(--paper-line);
  color:var(--cream);
  border-radius:var(--radius);
  padding:9px 10px;
  font-family:var(--font-mono);
  font-size:12px;
  outline:none;
}

.toggle-btn{
  background:var(--paper);
  border:1px solid var(--paper-line);
  color:var(--dust);
  border-radius:var(--radius);
  padding:9px 12px;
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  transition:.15s;
}
.toggle-btn.active, .toggle-btn:hover{color:var(--cream); border-color:var(--signal-dim);}

/* genre tab rail */
.genre-rail{
  display:flex; gap:6px; overflow-x:auto; overflow-y:visible;
  padding:14px 28px 16px 0;
  margin-right:-28px;
  scrollbar-width:none;
}
.genre-rail::-webkit-scrollbar{display:none;}
.genre-rail::after{content:""; flex-shrink:0; width:1px;}
.gtab{
  flex-shrink:0;
  font-family:var(--font-mono);
  font-size:11.5px;
  letter-spacing:0.04em;
  color:var(--dust);
  background:transparent;
  border:1px solid var(--paper-line);
  border-radius:100px;
  padding:6px 13px;
  white-space:nowrap;
  transition:.15s;
  display:flex; align-items:center; gap:7px;
}
.gtab .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
.gtab:hover{border-color:var(--dust-dim); color:var(--cream);}
.gtab.active{background:var(--paper-raised); color:var(--cream); border-color:currentColor;}
.gtab .count{color:var(--dust-dim); font-size:10.5px;}

/* ===== MAIN ===== */
main{position:relative; z-index:1; padding:8px 0 100px;}

.section-head{
  display:flex; align-items:baseline; gap:12px;
  margin:38px 0 16px;
  padding-bottom:10px;
  border-bottom:1px solid var(--paper-line);
}
.section-head .swatch{width:10px; height:10px; border-radius:2px; flex-shrink:0;}
.section-head h2{
  font-family:var(--font-display);
  font-weight:600;
  font-size:19px;
  text-transform:uppercase;
  letter-spacing:0.04em;
}
.section-head .n{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--dust-dim);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(158px, 1fr));
  gap:20px 16px;
}
#content.compact .grid{
  grid-template-columns:repeat(auto-fill, minmax(94px, 1fr));
  gap:12px 10px;
}
#content.compact .card-meta .album{display:none;}
#content.compact .scoreline{font-size:9px; gap:5px;}
#content.compact .rank-badge{font-size:9px; padding:1px 4px;}
#content.compact .own-badge{font-size:8px; padding:1px 4px;}
#content.compact .card-meta .artist{font-size:11px;}

.card{
  cursor:pointer;
  display:flex; flex-direction:column;
  gap:8px;
  border-radius:var(--radius);
  outline:none;
}
.card:focus-visible .cover-wrap{outline:2px solid var(--signal); outline-offset:2px;}

.cover-wrap{
  position:relative;
  aspect-ratio:1/1;
  background:var(--paper);
  border-radius:2px;
  overflow:hidden;
  border:1px solid var(--paper-line);
  transition:transform .18s ease, border-color .18s ease;
}
.card:hover .cover-wrap{border-color:var(--dust-dim);}
.cover-wrap img{
  width:100%; height:100%; object-fit:cover;
  opacity:0; transition:opacity .3s;
}
.cover-wrap img.loaded{opacity:1;}
.cover-fallback{
  position:absolute; inset:0;
  display:none; flex-direction:column; align-items:center; justify-content:center;
  gap:8px;
  background:
    repeating-radial-gradient(circle at 50% 50%, transparent 0 7px, rgba(255,255,255,0.025) 7px 8px),
    radial-gradient(circle at 50% 45%, var(--paper-raised) 0%, var(--paper) 72%);
  padding:14px;
  text-align:center;
}
.cover-fallback.show{display:flex;}
.fallback-disc{
  width:34%; aspect-ratio:1/1; border-radius:50%;
  background:var(--fc, var(--dust-dim));
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 2px rgba(0,0,0,0.35), 0 3px 10px rgba(0,0,0,0.45);
  flex-shrink:0;
}
.fallback-disc::after{
  content:''; width:24%; height:24%; border-radius:50%; background:var(--ink);
  box-shadow:inset 0 1px 2px rgba(0,0,0,0.5);
}
.fallback-title{
  font-family:var(--font-display); font-weight:600; font-size:11.5px; color:var(--cream);
  line-height:1.28;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.fallback-artist{
  font-family:var(--font-mono); font-size:9px; color:var(--dust-dim);
  text-transform:uppercase; letter-spacing:0.06em;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
}
.rank-badge{
  position:absolute; top:6px; left:6px;
  background:rgba(20,18,16,0.85);
  color:var(--dust);
  font-family:var(--font-mono);
  font-size:10px;
  padding:2px 6px;
  border-radius:2px;
  letter-spacing:0.03em;
}
.own-badge{
  position:absolute; top:6px; right:6px;
  background:var(--signal);
  color:var(--ink);
  font-family:var(--font-mono);
  font-size:9px;
  font-weight:600;
  padding:2px 5px;
  border-radius:2px;
  letter-spacing:0.04em;
}

.card-meta{padding:0 1px;}
.card-meta .artist{
  font-family:var(--font-body);
  font-weight:600;
  font-size:12.5px;
  color:var(--cream);
  line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
}
.card-meta .album{
  font-family:var(--font-body);
  font-size:12px;
  color:var(--dust);
  font-style:italic;
  display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  margin-bottom:6px;
}

.scoreline{
  display:flex; gap:8px;
  font-family:var(--font-mono);
  font-size:10px;
}
.scoreline span{color:var(--dust-dim);}
.scoreline b{color:var(--cream); font-weight:600;}
.scoreline .lbl{color:var(--dust-dim); margin-right:2px;}

/* ===== DETAIL DRAWER ===== */
.scrim{
  position:fixed; inset:0; background:rgba(10,9,8,0.72);
  z-index:90; opacity:0; pointer-events:none; transition:opacity .25s;
}
.scrim.open{opacity:1; pointer-events:auto;}

.drawer{
  position:fixed; top:0; right:0; bottom:0;
  width:min(680px, 100vw);
  background:var(--ink);
  border-left:1px solid var(--paper-line);
  z-index:91;
  transform:translateX(100%);
  transition:transform .32s cubic-bezier(.19,1,.22,1);
  overflow-y:auto;
  padding-bottom:60px;
}
.drawer.open{transform:translateX(0);}

.drawer-top{
  position:sticky; top:0; z-index:5;
  background:var(--ink);
  border-bottom:1px solid var(--paper-line);
  padding:16px 24px;
  display:flex; justify-content:space-between; align-items:center;
}
.close-btn{
  background:none; border:1px solid var(--paper-line); color:var(--dust);
  width:30px; height:30px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:16px;
  transition:.15s;
}
.close-btn:hover{color:var(--cream); border-color:var(--signal-dim);}

.drawer-body{padding:26px 24px 0;}

.detail-head{display:flex; gap:20px; margin-bottom:22px;}
.detail-cover{
  width:150px; height:150px; flex-shrink:0;
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:2px;
  overflow:hidden;
  position:relative;
}
.detail-cover img{width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity .3s;}
.detail-cover img.loaded{opacity:1;}

.detail-title-block{flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:6px;}
.genre-chip{
  align-self:flex-start;
  font-family:var(--font-mono);
  font-size:10px; letter-spacing:0.06em; text-transform:uppercase;
  padding:3px 9px; border-radius:100px;
  border:1px solid currentColor;
}
.detail-artist{
  font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--dust);
}
.detail-album{
  font-family:var(--font-display); font-weight:600; font-size:26px; line-height:1.15;
}
.detail-year{font-family:var(--font-mono); font-size:12px; color:var(--dust-dim);}

/* scoreboard */
.scoreboard{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:1px; background:var(--paper-line);
  border:1px solid var(--paper-line);
  border-radius:3px; overflow:hidden;
  margin-bottom:26px;
}
.score-cell{background:var(--paper); padding:14px 10px; text-align:center;}
.score-cell .who{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--dust-dim); margin-bottom:6px;
}
.score-cell .val{font-family:var(--font-display); font-weight:600; font-size:26px;}
.score-cell .val small{font-size:13px; color:var(--dust-dim); font-family:var(--font-mono); font-weight:400;}
.score-cell.will .val{color:#9db4d6;}
.score-cell.mason .val{color:#d69d9d;}

.field{margin-bottom:22px;}
.field-label{
  display:flex; align-items:center; justify-content:space-between;
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:0.08em;
  text-transform:uppercase; color:var(--dust-dim); margin-bottom:8px;
}
.field-label .who-tag{padding:1px 6px; border-radius:2px; font-size:9.5px;}
.field-label .who-tag.will{background:#2c3542; color:#9db4d6;}
.field-label .who-tag.mason{background:#3c2a2a; color:#d69d9d;}

.notes-text{
  font-family:var(--font-body); font-size:14px; line-height:1.6; color:var(--cream);
  white-space:pre-wrap;
}

.own-line{
  font-family:var(--font-mono); font-size:11px; color:var(--dust-dim); margin-bottom:22px;
  display:flex; align-items:center; gap:8px;
}
.own-line input{accent-color:var(--signal);}

.tracklist{display:flex; flex-direction:column; gap:2px;}
.track-row{
  display:flex; align-items:baseline; gap:8px;
  font-family:var(--font-mono); font-size:12.5px; color:var(--cream);
  padding:4px 0; border-bottom:1px solid var(--paper-line);
}
.track-num{color:var(--dust-dim); width:20px; flex-shrink:0;}
.track-name{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.track-time{color:var(--dust-dim); flex-shrink:0;}

/* empty state */
.empty-state{
  text-align:center; padding:80px 20px; color:var(--dust);
  font-family:var(--font-display); font-size:18px;
}

/* ===== STATS VIEW ===== */
.stats-intro{
  margin:30px 0 20px;
}
.stats-intro h2{
  font-family:var(--font-display); font-weight:600; font-size:22px; margin-bottom:6px;
}
.stats-intro p{
  font-family:var(--font-body); font-size:13px; color:var(--dust); max-width:640px;
}
.stats-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:14px;
  margin:0 0 32px;
}
.stat-card{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:4px; padding:18px;
}
.stat-card .label{
  font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
  color:var(--dust-dim); margin-bottom:8px;
}
.stat-card .value{
  font-family:var(--font-display); font-weight:600; font-size:28px; color:var(--cream);
}
.stat-card .sub{
  font-family:var(--font-mono); font-size:11px; color:var(--dust); margin-top:5px;
}
.chart-card{
  background:var(--paper); border:1px solid var(--paper-line); border-radius:4px; padding:22px;
  margin-bottom:24px;
}
.chart-card h3{
  font-family:var(--font-display); font-weight:600; font-size:16px; margin-bottom:4px;
}
.chart-card .desc{
  font-family:var(--font-body); font-size:12.5px; color:var(--dust); margin-bottom:18px; max-width:600px;
}
.chart-canvas-wrap{position:relative; height:320px;}
.chart-canvas-wrap.tall{height:420px;}
.charts-two-col{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
.disagree-list{display:flex; flex-direction:column; gap:8px;}
.disagree-item{
  display:flex; align-items:center; gap:14px; padding:11px 14px;
  background:var(--paper-raised); border-radius:3px; border-left:3px solid var(--signal-dim);
}
.disagree-item .rank{font-family:var(--font-mono); font-size:11px; color:var(--dust-dim); width:38px; flex-shrink:0;}
.disagree-item .names{flex:1; min-width:0;}
.disagree-item .artist{font-weight:600; font-size:13px; color:var(--cream);}
.disagree-item .album{font-size:12px; color:var(--dust); font-style:italic;}
.disagree-item .scores{
  font-family:var(--font-mono); font-size:12px; display:flex; gap:14px; flex-shrink:0; align-items:center;
}
.disagree-item .scores b{color:var(--cream);}
.disagree-item .scores .gap{color:var(--signal); font-weight:600;}

@media (max-width:900px){
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .charts-two-col{grid-template-columns:1fr;}
}

/* footer */
footer{
  border-top:1px solid var(--paper-line);
  padding:24px 0 40px;
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--dust-dim);
  text-align:center;
}

@media (max-width:640px){
  .wrap{padding:0 16px;}
  .top-inner{padding:16px 0 12px;}
  .brand h1{font-size:18px;}
  .search-box input{width:150px;}
  .grid{grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:16px 10px;}
  .drawer{width:100vw;}
  .detail-head{flex-direction:column;}
  .detail-cover{width:100%; height:auto; aspect-ratio:1/1;}
}
</style>
</head>
<body>

<div id="bgMosaic"></div>
<div id="bgOverlay"></div>

<header class="top">
  <div class="wrap">
    <div class="top-inner">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>The Collection</h1>
          <div class="sub" id="countLabel">500 albums · sorted by genre</div>
        </div>
      </div>
      <div class="controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="searchInput" type="text" placeholder="Search artist or album…">
        </div>
        <select class="sortsel" id="sortSelect">
          <option value="rs" selected>Sort: RS Order (1–500)</option>
          <option value="will">Sort: Will's Highest Rated</option>
          <option value="mason">Sort: Mason's Highest Rated</option>
          <option value="genre">Sort: Genre</option>
          <option value="year-desc">Sort: Year (newest)</option>
          <option value="year-asc">Sort: Year (oldest)</option>
          <option value="artist">Sort: Artist A–Z</option>
        </select>
        <button class="toggle-btn" id="ownToggle">Owned only</button>
        <button class="toggle-btn" id="compactToggle">Compact</button>
        <button class="toggle-btn" id="randomBtn">Random</button>
        <button class="toggle-btn" id="statsToggle">Stats</button>
      </div>
    </div>
    <div class="genre-rail" id="genreRail"></div>
  </div>
</header>

<main class="wrap">
  <div id="content"></div>
  <div id="statsView" style="display:none;"></div>
</main>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-top">
    <span style="font-family:var(--font-mono); font-size:11px; color:var(--dust); letter-spacing:0.06em;" id="drawerCounter"></span>
    <button class="close-btn" id="closeDrawer">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</div>

lly by their later, more fully-realized synth-pop work."}, {"rsRank": 491, "artist": "albert king", "album": "born under a bad sign", "year": 1967, "genre": "Blues", "own": false, "will": {"score": 7.0, "notes": "classic blues with familiar covers and solid performances, personal manager and the title track are good"}, "mason": {"score": 7.5, "notes": "Incredibly good blues record. The title track and the hunter are my favorite tracks on this album, and some of my favorite blues tracks full stop. I almost lost my mind is a little boring, but other than that this is great for a blues record"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/2e/4f/87/2e4f87e0-a058-ff87-b35d-7d4f0f6d4d06/21CRGIM30577.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded blues record valued for King's guitar tone and the title track, though considered a minor entry next to his best work."}, {"rsRank": 490, "artist": "zz top", "album": "tres hombres", "year": 1973, "genre": "Rock", "own": true, "will": {"score": 9.0, "notes": "great classic rock / blues album, alternates fast rockers (beer drinkers, la grange), slow blues (jesus just left chicago, have you heard), and ballad style blues (hot blue & righteous, precious and grace)"}, "mason": {"score": 8.5, "notes": "When it comes to southern rock, outside of the Allman bros you can't get much better than this. there are all time classics like la grang, the bus one, and chicago Jesus. There are good guitaring and stuff also with excellent songwriting'"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/19/4d/3c/194d3c17-7a21-5622-0939-16feb62b6b07/0603497921430.jpg/600x600bb.jpg", "consensus": "A fan-favorite slab of Texas blues-rock, admired for its groove and humor even if critics rank it below ZZ Top's later commercial peak."}, {"rsRank": 489, "artist": "kiss", "album": "destroyer", "year": 1976, "genre": "Rock", "own": false, "will": {"score": 6.25, "notes": "almost sounds like a parody of 70s hard rock but theres some quality to be found (detroit rock city, king of the night time world. shout it out loud)"}, "mason": {"score": 5.0, "notes": "foundational Glam rock album for the better or for the worse. the songwriting is repetitive and the style gets old quickly. That being said, there are some classic songs on here like detroit, but beth cancels it out. overall it's not too bad as they do indeed know how to rock"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/7b/a5/9b/7ba59b98-a9ae-04d0-d962-a304785830d7/21UM1IM23268.rgb.jpg/600x600bb.jpg", "consensus": "Considered one of Kiss's most consistent studio albums, praised for its production ambition and songs like 'Detroit Rock City.'"}, {"rsRank": 488, "artist": "husker du", "album": "new day rising", "year": 1985, "genre": "Punk", "own": false, "will": {"score": 4.0, "notes": "noise rock punk with high energy and low quality, sounds like an album that beavis and butthead would love. could easily have slotted a Dead Kennedys album here instead, husker du were clearly inspired by them and this just seems effectively like an uninteresting dead kennedys album with no new ideas"}, "mason": {"score": 2.0, "notes": "I normally enjoy low production quality on punk records but this is an exception. The writing is a little bland, but the instrumentals are good. I like how experimental it is for 80s punk. the vocals are mid. Title track is the highlight for me."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/de/76/01/de7601a3-d8ec-291f-2ac8-75c6e62271a1/57741.jpg/600x600bb.jpg", "consensus": "Considered the strongest of Hüsker Dü's three landmark mid-'80s albums by many critics, praised for pairing hardcore velocity with pop songcraft."}, {"rsRank": 487, "artist": "cyndi lauper", "album": "she's so unusual", "year": 1983, "genre": "Pop", "own": false, "will": {"score": 4.75, "notes": "hook filled 80s synth pop, her distinctly childish vocals get a little grating over the course of t ecially Not for You and better man."}, "mason": {"score": 6.0, "notes": "Experimental grunge with some good hits. It's not their best work but it's still very enjoyable although it can get more mid by the end. Vedder's vocals push this album to a 7. That man has a great pair of vocal chords let me tell you."}, "coverUrl": null, "consensus": "Widely acclaimed as a raw, cathartic follow-up to 'Vs.,' praised for its unpolished production and unflinching songwriting."}, {"rsRank": 484, "artist": "mott the hoople", "album": "all the young dudes", "year": 1972, "genre": "Rock", "own": true, "will": {"score": 6.5, "notes": "foundational glam rock album, some cool little production choices like the tape cut into All The Young Dudes and the comically long outros on a couple songs. decent but not one I'd go back to often besides a few songs (title track, sweet Jane, ready for love)"}, "mason": {"score": 5.5, "notes": "Middling rock album. Fairly generic with poor vocals and subpar songwriting. Most tracks are forgettable especially on the second side. This album benefitted greatly from being around talent."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Features114/v4/99/8e/8e/998e8e5d-4ec2-7ef6-1e74-745f83bed86e/dj.jafaslnz.jpg/600x600bb.jpg", "consensus": "Considered a glam-rock touchstone, with the title track especially influential, though reviewers note the rest of the album is less consistent."}, {"rsRank": 483, "artist": "gang of four", "album": "entertainment!", "year": 1979, "genre": "Punk", "own": false, "will": {"score": 3.0, "notes": "not my kind of album. experimental punk? At least husker du had interesting instrumentation, this is just a bland attempt at a more politically charged velvet underground album. love like anthrax is the only somewhat interesting track"}, "mason": {"score": 2.0, "notes": "This foundational alt punk record was very influential, however the the only thing it influenced me to do was to go to bed because it's boring. Some of the songs on the first side are passable but most of the album is fairly boring."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/86/8e/e9/868ee973-0caf-a663-9d4f-58ff57c104da/191401174275.png/600x600bb.jpg", "consensus": "A cornerstone of post-punk, celebrated by critics for its stark funk-inflected sound and political edge, hugely influential despite modest sales."}, {"rsRank": 482, "artist": "steve earle", "album": "guitar town", "year": 1986, "genre": "Country", "own": false, "will": {"score": 2.0, "notes": "country album that's clearly designed to be hooky, which isn't a bad thing. the only problem is that there are no hooks and the song structures are often the most tired cliches in pop music, but I suppose that's just a country album thing. the most interesting chord change you'll find on this album is a G to a C."}, "mason": {"score": 3.0, "notes": "Mid neurotypical country album. There was nothing particularly wrong with it, but it's just so generic and poppy. nothing interesting or different was done on this album. It mostly sounded the same and the lyrics were nothing too special,"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music128/v4/6d/5a/01/6d5a013a-f20c-c9eb-b062-51e8b493bbc6/00602547849410.rgb.jpg/600x600bb.jpg", "consensus": "Well-regarded as a clean, hooky entry in the alt-country/New Traditionalist movement of the mid-'80s, if not considered essential listening today."}, {"rsRank": 481, "artist": "d'angelo", "album": "voodoo", "year": 2000, "genre": "R&B", "own": false, "will": {"score": 3.75, "notes": "some good grooves present on this influential neo soul record but not nearly enticing enough to justify the self indulgent track lengths, good production and musicality but the musicians don't have anything to do on these songs besides repeat the same groove for 7 minutes on every song without any flairs"}, "mason": {"score": 6.0, "notes": "This album successfully achieves a Neo-soul sound, which is kind of a mix between 90's R&B and 70's funk and soul along with some alt hip hop. Palladino held the groove down on the bass, while Questlove held down the rhythm on the drums. Along with D'Angelo's singing, this made for a very intriguing listen. They sound like the roots but more groovy and It's a vibe. best song is Left and Right."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/e9/b9/9e/e9b99e73-58a5-1e31-f57c-b11e78419dcf/16UMGIM86249.rgb.jpg/600x600bb.jpg", "consensus": "A landmark neo-soul record, acclaimed for its grooves and Prince-and-Marvin-Gaye lineage, though its slow-burn indulgence divides listeners."}, {"rsRank": 480, "artist": "chef raekwon", "album": "only built 4 cuban linx", "year": 1995, "genre": "Hip Hop", "own": false, "will": {"score": 1.75, "notes": "this album, it's not my kind of album"}, "mason": {"score": 6.0, "notes": "Chef Raekwon was cooking and Ghostface Killa was acting more like Goatface killa. this album is pretty good but it's dragged down by subpar production compared to 36 chambers and it also drags a little long. Favorite songs are Ice Cream and Guillotine (Swordz)"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music4/v4/8e/fb/f2/8efbf20d-84d2-5b34-f617-6a026e1bacee/05099996879351.jpg/600x600bb.jpg", "consensus": "Hailed as a classic of '90s mafioso rap, celebrated for RZA's cinematic production and Raekwon and Ghostface's vivid storytelling."}, {"rsRank": 479, "artist": "funkadelic", "album": "maggot brain", "year": 1971, "genre": "Funk", "own": false, "will": {"score": 7.25, "notes": "great guitar playing and songwriting, p-funk classic though it stumbles a bit by the end, the title track is the only huge song but can you get to that and hit it and quit it are also peak"}, "mason": {"score": 8.0, "notes": "The first 3 songs are Pfunk all time classics and after that it becomes more strange and dark. It has a strange vibe because it was before they perfected their sound so it still has a little old school soul left in it which gives it a really unique sound. overall this is a very good record"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/11/ca/ad/11caadd3-407d-327b-2c29-a3a633871286/66302.jpg/600x600bb.jpg", "consensus": "Considered a high point of P-Funk, with the title track a touchstone of psychedelic rock guitar, even as the rest of the record is uneven."}, {"rsRank": 478, "artist": "loretta lynn", "album": "all time greatest hits", "year": 1979, "genre": "Country", "own": false, "will": {"score": 3.5, "notes": "better than steve earle's country album but only because there's actually a bit of energy and creativity, however it's extremely repetitive and genuinely at least 10 songs must have the exact same backing tracks and pedal steel riffs because they sound like carbon copies. this is the easiest album so far for AI to create, just put in the prompt \"conservative christian country\""}, "mason": {"score": 3.0, "notes": "It's foundational country stuff. There are many problems that I have with it, however. Most of these problems stem from it being a country album. If you've heard one song, you've heard them all. The songwriting is very hook-based and poppy. It's very generic and It's not really my genre in music. I could see a middle-aged mom in the 70s and early 80s listening to this. Louisiana Woman, Mississippi man is a fire song but other than that it's fairly generic"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/5d/5e/d6/5d5ed69a-17ea-f8fd-4656-7354189efdff/06UMGIM12697.rgb.jpg/600x600bb.jpg", "consensus": "A respected greatest-hits collection showcasing Lynn's blunt, working-class songwriting, though compilation status limits its 'album' standing critically."}, {"rsRank": 477, "artist": "merle haggard", "album": "The essential merle haggard: the epic years", "year": 1981, "genre": "Country", "own": false, "will": {"score": 2.0, "notes": "not much redeeming about this album, im just not a fan of country I guess because gs ever(10). Other side is based as well(10). Get on top should be more popular(10) Californication is insanely overrated but not bad in the slightest (worst song on the album)(8.5). Easily is a soft banger(10). Porcelain has a vibe that is good(9). Emit Remmus is absolute banger level with crazy bass(10). I like I like dirt(10). It had a catchy hook and a groovy rhythm. This velvet grove is a modern classic(10). Savior is literally the vibe of the record (10). if you can stand the disgusting first line of the song then purple stain is one of the bangeriest songs in the album \"knock on wood we all stay good cause we all live in Hollywood\" (9.9). Right on time: verse is hyped and chorus is aight (9.5). Road trippin: peak rhcp storytelling or something and it's a megavibe (10) 146.9/15=9.79~10 ---------- Ok I gotta yap for a minute about the title track. You may have noticed that that is way lower than anything else despite it being way more popular than any other song on the album. And there’s a reason for that. This song is WAY overrated. It is way too long without changing much at all. Seriously, all the verses are essentially the same and it’s so uninteresting. The worst part of the song is not in any verse or chorus however. It’s the guitar solo. This may be Frusciante’s worst ever solo and I'm not exaggerating. This solo is boring and nothing happens. It’s just some glorified lame breakdown. I get they were going for a chill vibe but they did that way better in other songs in the album like easily and porcelain. ---------- Anyway this is my first and possibly only 10 in a long time so lock in chat. I will finish this review off with a Machiavelli quote: “it is much safer to be feared than loved because ...love is preserved by the link of obligation which, owing to the baseness of men, is broken at every opportunity for their advantage; but fear preserves you by a dread of punishment which never fails.” I don’t love this record at all. I fear it. Its very power and essence whenever I put it on puts me into a comatose state of shock where I am unable to do anything but let the vibrations from the recording hit me and amaze me in ways I didn’t think were possible before."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/4c/86/1d/4c861dab-5428-f3b7-8068-82bb69db5e89/093624932130.jpg/1200x630wp-60.jpg", "consensus": "Widely acclaimed as a career-defining Chili Peppers record, praised for its melodic maturity and hits like 'Scar Tissue' and the title track."}, {"rsRank": 400, "artist": "The Temptations", "album": "The Best of the Temptations", "year": 1972, "genre": "R&B", "own": false, "will": {"score": 8.25, "notes": "straight motown bangers, basically every song is fire especially papa was a rolling stone. though it's a greatest hits album and those have no place on this list I guess im just rating it based on the quality of its parts and about 82.5% of this album is fire so it gets an 8.25"}, "mason": {"score": 6.5, "notes": "All the songs on here are good but being a compilation makes it not as cohesive as an album. This is just a bunch of radio hits in a random order. It's still pretty good though."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/1f/fd/85/1ffd85fa-16d0-f645-afb6-c6597ee9cff0/06UMGIM04922.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded compilation showcasing the Temptations' vocal group harmonies and Motown songcraft across their classic-era hits."}, {"rsRank": 399, "artist": "Tom Waits", "album": "Rain Dogs", "year": 1985, "genre": "Rock", "own": false, "will": {"score": 4.5, "notes": "better than his 90s record, the tracks all have something happening in them but nothing that i would call incredibly interesting. the vibe of the record is a cool sleazy inner city type of mood which is cool and his voice doesnt have as many annoying effects as in the 90s record, but it sometimes is still annoying like on the last track"}, "mason": {"score": 6.0, "notes": "A fun th Chamber Pt. 2: This is probably better than 7th chamber but it’s really more of a remix than anything so I’ll only weigh it as half of a song (9.5/2). 103.75/11.5=~9"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/8c/20/1f/8c201f03-7617-2d8b-3d8d-e0ba2d55041b/196872123784.jpg/600x600bb.jpg", "consensus": "Overwhelmingly hailed as a landmark of East Coast hip-hop, praised for RZA's gritty production and the Wu-Tang collective's raw chemistry."}, {"rsRank": 386, "artist": "Steely Dan", "album": "Pretzel Logic", "year": 1974, "genre": "Rock", "own": true, "will": {"score": 9.25, "notes": "flawlessly produced and expertly crafted rock. Legendary bangers include night by night, Parker's band, any major dude, with a gun, monkey in your soul. Points taken off for Charlie freak being not bad but still the worst steely Dan song in their original run, and for Pretzel being spelled wrong on the album cover (not their fault, it's just some random guy they took a photo of without his permission or knowledge)"}, "mason": {"score": 6.5, "notes": "Ok so there are a few good songs like Parker’s Band, Rikki, Any Major Dude, and Night By Night, but the rest are filler and kinda mid. The production quality stays constant which is rare for filler songs but it makes them much more enjoyable."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/49/6e/70/496e703c-f15e-8e95-821c-f94fac1f4c8e/23UMGIM50278.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded Steely Dan record, praised for its jazz-inflected songcraft, generally seen as a strong transitional album in their catalog."}, {"rsRank": 385, "artist": "Bob Dylan", "album": "“Love and Theft”", "year": 2001, "genre": "Folk", "own": false, "will": {"score": 8.75, "notes": "the more I listen to this album the more I like it, and I've listened to it a LOT. best songs are tweedle Dee and tweedle dum, summer days, lonesome day blues, honest with me, high water, cry a while. There's something endlessly ed while bringing in new sound elements. I like it (8). Wonderwall: Eww (1). Look Back In Anger: Peak songwriting but I could do without the chorus (7.5). Hey Now: Fun song with interesting writing (8). Some Might say: Nice Alt-Rock sound but a little too spacey for my taste(6.5). Cast no shadow: Softer than most of the other stuff on the album but it’s lowkey a vibe so I’ll let it pass (6). She’s electric: Very American inspired compared to everything elso on this album like tumbleweed connection so I’ll give this what I gave timbleweed connection (8). Moring Glory: Lowkey a banger and a half (9). Champagne Supernova: MID! gets better at the end (6.5). 69(nice)/10=~7"}, "coverUrl": null, "consensus": "A generation-defining Britpop blockbuster, beloved for its anthemic choruses even as some critics found it bombastic and derivative."}, {"rsRank": 377, "artist": "John Lee Hooker", "album": "The Ultimate Collection: 1948–1990", "year": 1991, "genre": "Blues", "own": false, "will": {"score": 7.25, "notes": "banging classic blues. Samey at times but whatever it goes hard. house rent boogie, bad like Jesse James, boom boom, 1B1S1B are the best"}, "mason": {"score": 7.5, "notes": "This is about as good as good as you can get for a compilation. It starts with Teachin The Blues and then takes us through much of his discography chronologically. It starts this journey with the Legendary Boogie Chillen’/Sally Mae single from 1948 and it ends with a modern recording of him with Bonnie Raitt. It’s literally all bangers."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/d6/03/e3/d603e3b7-ec93-811f-fbb4-25f999eab36c/00008811053925.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded compilation surveying Hooker's decades-spanning blues career, valued as a solid introduction rather than a singular statement."}, {"rsRank": 376, "artist": "Björk", "album": "Post", "year": 1995, "genre": "Electronic", "own": false, "will": {"score": 3.75, "notes": "straight up bjorking it. euro dreampop that sounds like yoko at times, sounds ethereal at other times, but never sounds like anything else that came out anywhere near this. not really my thing at all but very well put together for what its worth"}, "mason": {"score": 2.5, "notes": "I won't complain because the only thing that could be worse than her is an army of her. This album is europop electronica which is as far away from my thing as you can get so I guess I don't understand the genius of this thing."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/69/62/1c/69621c9a-514f-00cf-1de6-6e49f004fb28/075596174060.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as an art-pop landmark, praised for Björk's fearless genre-blending and emotional intensity."}, {"rsRank": 375, "artist": "Jackson Browne", "album": "Late for the Sky", "year": 1974, "genre": "Rock", "own": false, "will": {"score": 4.25, "notes": "great lyrics but it might as well be poetry because absolutely nothing is happening musically"}, "mason": {"score": 5.5, "notes": "It's by far the best album he has here. The first couple and last couple of tracks.are the best and the middle is mid. Much more energetic than the other Browne records like he actually had fun making his music."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/24/b9/7d/24b97d71-9533-26fc-24f8-aca09e0706eb/dj.tzaofmft.jpg/600x600bb.jpg", "consensus": "Frequently cited by critics as Jackson Browne's finest hour, praised for its melancholic, autobiographical songwriting."}, {"rsRank": 374, "artist": "Roxy Music", "album": "Siren", "year": 1975, "genre": "Rock", "own": false, "will": {"score": 2.25, "notes": "starting to think im not a big Roxy music fan"}, "mason": {"score": 4.0, "notes": "There are a lot of good ideas here that just don't go anywhere. every song just feels like missed potential and it's kind of frustrating because they all could have been made so much better. The 1st track is fire though that one is y like 70s music should sound. The Reggae sound is mixed well with the classic rock sound and creates something very unique that I like. Sting comes with the strong basslines which are more toned in than last record while still being less poppy than Synchronicity. The drumming is holy. The last few tracks are experimental and I like it. Overall this is about as good as Outlandos."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/74/2a/da/742ada22-9a00-1620-b72e-6667745b010a/16UMGIM60881.rgb.jpg/600x600bb.jpg", "consensus": "Generally praised as a strong sophomore Police record, admired for its reggae-punk fusion and the instrumental title track."}, {"rsRank": 371, "artist": "Arctic Monkeys", "album": "Whatever People Say I Am, That’s What I’m Not", "year": 2006, "genre": "Indie", "own": false, "will": {"score": 7.0, "notes": "i was not expecting to like this album at all because all i knew about the arctic monkeys was their 2010s Imagine Dragons type hits that played on the radio when i was younger, but this is legitimately good garage punk in the vein of the white stripes, also they are comically british and they HAVE to be exaggerating the accent on some songs because its lowkey funny"}, "mason": {"score": 6.5, "notes": "More garage rock a la White stripes but I think It's well executed. Not too many standouts because pretty much every song was good."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/69/9c/b5/699cb5d6-115c-ff73-9d26-e57ea4350d72/887828031795.png/600x600bb.jpg", "consensus": "A critical and commercial phenomenon in the UK, praised for its witty, vernacular songwriting and instant hooks."}, {"rsRank": 370, "artist": "Mott the Hoople", "album": "Mott", "year": 1973, "genre": "Rock", "own": false, "will": {"score": 3.25, "notes": "how this is higher than all the young dudes i have no idea. bowie's absence in this records production is painfully apparent, every song is similar and the themes are tired retreadings. singing about how cool rock and roll is does NOT work in 99% of cases"}, "mason": {"score": 3.0, "notes": "So generic and boring not much to say"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Features114/v4/99/8e/8e/998e8e5d-4ec2-7ef6-1e74-745f83bed86e/dj.jafaslnz.jpg/600x600bb.jpg", "consensus": "Well-regarded as a glam-era Mott the Hoople highlight, praised for its songwriting and the anthemic title track."}, {"rsRank": 369, "artist": "The Smiths", "album": "Louder Than Bombs", "year": 1987, "genre": "Indie", "own": false, "will": {"score": 5.75, "notes": "not a true album, just some scraps so it feels disjointed at times, lots of songs sound similar but the formula isn't boring for the most part. best songs are please please please, heaven knows, hand in glove, this night has opened my eyes"}, "mason": {"score": 1.0, "notes": "Same old jangle pop the Smiths are infamous for but this time it's not even a cohesive album"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/02/3a/62/023a629e-1541-c493-0b45-536cbe9b59dd/825646642847.jpg/600x600bb.jpg", "consensus": "A well-received singles compilation gathering non-album Smiths tracks, valued by fans even if compilation status limits critical 'album' ranking."}, {"rsRank": 368, "artist": "Eagles", "album": "Eagles (1st album)", "year": 1972, "genre": "Rock", "own": false, "will": {"score": 8.25, "notes": "great country rock album. captivating cuts like witchy woman and train leaves here this morning are an early look at the songwriting abilities of the eagles that would culminate on hotel California. tryin' and take it easy are fun uptempo rock songs, earlybird and peaceful easy feeling have soothing harmonies and chilled out steel guitar. these mellow instrumentals allow the lyrics to pierce the listener and they're great lyrics too. really the record has a sunny californian calming quality to it and it's infectious"}, "mason": {"score": 6.0, "notes": "Nice record. IDK how I never noticed the k singles compilation, valued for the Buzzcocks' knack for melodic, romantically frustrated hooks."}, {"rsRank": 359, "artist": "Elton John", "album": "Honky Château", "year": 1972, "genre": "Rock", "own": true, "will": {"score": 9.5, "notes": "this one took a while to become one of my favorite piano rock albums ever. every song is full of juicy foot tapping melodies and EVERY chorus on here is irresistibly catchy. The only piano album I could think of to rival this is maybe the stranger. My favorite song on here has to be Hercules for the stupidly fun doo wop chorus"}, "mason": {"score": 9.0, "notes": "This album sounds incredible. The instruments are super diverse keeping the album interesting the whole way through. The singing only complements it. This is definitely one of the greatest piano rock albums I have ever listened to. It doesn't miss! My favorite song is Honky Cat but the worst song isn't far behind because of how consistant this is. Definitely better than Tumbleweed."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/75/b6/da/75b6da76-a3e0-6a77-cbe5-ad6c42cb0692/06UMGIM48050.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded early Elton John/Bernie Taupin record, praised for its more relaxed, French-inflected sound, if less iconic than later hits."}, {"rsRank": 358, "artist": "Miles Davis", "album": "Sketches of Spain", "year": 1960, "genre": "Jazz", "own": false, "will": {"score": 6.25, "notes": "cool spanish tinged jazz. went hard while walking to class on a brisk february morning. generally though i like jazz with more instruments than horns and sparse accompaniment"}, "mason": {"score": 7.0, "notes": "This is a pretty good jazz album but it didn't really blow me away which is what is expected of miles davis. There aren't any bad songs but i'm not really a fan of the structure. The first and last songs are epics. the first one stays interesting throughout but the last one kinda drags. the middle 3 songs are way too short for what they are and don't really go anywhere. These aren't too big of an issue as this album is still great ."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music/v4/cd/86/0c/cd860cb5-675b-2466-158d-487ace32e717/886444505321.jpg/600x600bb.jpg", "consensus": "Praised by jazz critics for Miles Davis and Gil Evans' orchestral, Spanish-tinged collaboration, considered a distinct and elegant entry in Davis's catalog."}, {"rsRank": 357, "artist": "The Rolling Stones", "album": "Between the Buttons", "year": 1967, "genre": "Rock", "own": true, "will": {"score": 8.25, "notes": "this album took a while to grow on me but its just full of simple fun pre psych rock tracks. probably their most british album in terms of style and the way mick jagger sings (something happened to me yesterday, whos been sleeping here). cool calm collected and she smiled sweetly are my favorites. all sold out is maybe the only dud"}, "mason": {"score": 4.5, "notes": "For a Rolling Stones record this is terrible. In reality it's just really mid. Connection is good but nothing else stands out."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music128/v4/a8/48/68/a84868ac-967d-4947-5105-0b2e3afd3cdb/00018771895220.rgb.jpg/600x600bb.jpg", "consensus": "Generally seen as a transitional, uneven Rolling Stones record bridging their R&B roots and psychedelic experiments."}, {"rsRank": 356, "artist": "Randy Newman", "album": "12 Songs", "year": 1970, "genre": "Rock", "own": false, "will": {"score": 6.5, "notes": "sparser instrumentation and production than good old boys, which highlights the lyrics. they're interesting but not enough to sustain the album beyond its singles and comically offensive satirical tracks (yellow man, down by the Harlem moon). 5/26 RERANK cause annas taking forever to listen to this one so i went back to see how it is again and its really not that bad. i like the way this dude writes a song. fairly fun listen."}, "mason": {"score": 3.5, "notes": "It's like if Good Old Boys was more bland and uninspired. I predict William will love this and give it like a 9 though."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music4/v4/c8/b6/0e/c8b60e9d-ea3d-e4a2-299a-a68feec805fd/075992744966.jpg/600x600bb.jpg", "consensus": "A well-regarded Randy Newman record, praised for its sardonic character studies and orchestral arrangements."}, {"rsRank": 355, "artist": "The Yardbirds", "album": "Having a Rave Up", "year": 1965, "genre": "Rock", "own": false, "will": {"score": 4.75, "notes": "suffers from repetitive songs and lackluster production."}, "mason": {"score": 5.0, "notes": "This record may have the worst production I have ever heard lol. It's essentally an ep with a couple of live songs which I think works pretty well. The songwriting is great and there is some of the best guitar playing you can find at the time with guitarists Clapton, Page, and Beck (not that beck). It's just that production holds it back so much. they made it stereo but 60's stereo so they just shove half of everything into one ear and everything elso into the other half making it sound horiffic. This is pretty good for the time though I reckon"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music123/v4/5f/53/18/5f531843-c274-b8d5-7666-2c78b53b5409/LM00234187.jpg/600x600bb.jpg", "consensus": "A well-regarded document of the Yardbirds' live blues-rock power, valued for showcasing their guitarist lineage in an unpolished setting."}, {"rsRank": 354, "artist": "Billy Joel", "album": "52nd Street", "year": 1978, "genre": "Rock", "own": true, "will": {"score": 9.25, "notes": "wall to wall bangers except Until The Night, everything else is flawless piano rock. zanzibar, stiletto, 52nd street, and my life are all-timers. smooth jazzy feel on the whole record, top notch songwriting and melodies"}, "mason": {"score": 6.0, "notes": "First side is pretty good but it drags hard on the second side. This could have been a 7/10 EP."}, "coverUrl": "https://is1-ssl.mzstatic
