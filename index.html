ts funky, socially conscious songwriting and synthesizer experimentation."}, {"rsRank": 23, "artist": "John Lennon/Plastic Ono Band", "album": "John Lennon/Plastic Ono Band", "year": 1970, "genre": "Rock", "own": true, "will": {"score": 8.75, "notes": "very raw record in instrumentation, production and lyricism. Totally put into the world of traumatized lennon for better or for worse. I don't really need as much \"so much pain I'm so sad\" lyrics as we get here, which is maybe a horrible thing to say but honestly I don't want to hear this many songs about him reliving childhood trauma. It works best when he's angry, like I found out, well well well, and working class hero. The whiplash you get in this album from love into well well well into look at me is absolutely wild, and mother into hold on is kinda like that too. this record has all the ups and downs of a bipolar heroin addict which is quite fitting. kinda shocked to see it so high but I respect it"}, "mason": {"score": 4.5, "notes": "Hold on is good and the rest is just john lennon being the original redditor. Hating on capitalism AND being an athiest are cringe and there's also a lot of boring emotional songs that nobody cares about. hold on is good however and they're all not bad at their instruments."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/48/53/43/485343e3-dd6a-0034-faec-f4b6403f8108/13UMGIM63890.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed solo Lennon record, praised for its raw, stripped-down, emotionally unflinching songwriting."}, {"rsRank": 22, "artist": "Robert Johnson", "album": "King of the Delta Blues Singers", "year": 1937, "genre": "Blues", "own": false, "will": {"score": 5.75, "notes": "obviously an essential blueprint for all blues music as we know it but that doesnt necessarily mean we need to listen to it. at the end of the day its a record from the 1930s and its going to have poor quality and thats fine and its influential and basically everything that became of this record is better to listen to than this record. literally like every song you can recognize a line thats ripped off in a thousand other songs if the song itself hasnt been covered to death (they all have)."}, "mason": {"score": 7.5, "notes": "People really had it hard back then. If you wanted to hear good music you had to find somebody who sold their soul to the devil. In Robert johnson's short time being a recorded artist he created all of the norms for modern blues and rock music. Music would be nothing like it is today if it wasn't for him. That being said, this music is quite dated by today's standards and the production quality, while sounding good for its time, does not today"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/3c/74/0d/3c740deb-0293-4184-a66d-5176b9e872a4/mzi.scyemciw.jpg/600x600bb.jpg", "consensus": "Widely acclaimed blues compilation, praised for the haunting, foundational recordings that shaped rock and blues guitar."}, {"rsRank": 21, "artist": "Chuck Berry", "album": "The Great Twenty‐Eight", "year": 1964, "genre": "Rock", "own": true, "will": {"score": 8.5, "notes": "a much more listenable comp than the last one but I'd lowkey rather have seen a couple chuck berry albums dotted throughout than one compilation at the end. he's got so many bangers and I'm glad he's getting representation in the top 25 cause he really was that influential on the rock greats of the 60s and 70s"}, "mason": {"score": 6.5, "notes": "a compilation at 21 is joever. It's mostly good but still. we don't need this. I would have preferred chuck berry on top  here"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/20/0c/da/200cdaef-faf4-aaca-96d6-b3d394751321/24UMGIM34828.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed compilation, praised for Chuck Berry's foundational songwriting and guitar riffs that shaped rock and roll."}, {"rsRank": 20, "artist": "Michael Jackson", "album": "Thriller", "year": 1982, "genre": "Pop", "own": true, "will": {"score": 9.25, "notes": "it's thriller what can you say. I believe there is not a single 3 track run in any album that is more foundational to popular music than Thriller / Beat It / Billie Jean. every song is instantly recognizable to anyone on the planet which is just crazy. however that means its a bit overplayed for me. Human nature baby be mine, wanna be starting something, PYT, and girl is mine are all classics that you would not be surprised to hear playing literally anywhere and there's not a lot of other albums (if any) that you can say that about"}, "mason": {"score": 8.5, "notes": "this album has some goated production by Q and temper10 and incredible vocals by literal michael jackson. The instrumentation too is goated with the likes of Toto and VanHalen. The only problem is that there are 2 tracks that aren't good. Baby be mine is nothing to horrific but it's unbareably mid compared to the peak that is the rest of the album. The Girl Is Mine, however, IS offensive. It's a lot more instrumentally boring than a lot of other songs, It lacks lyrical depth, and it has a member of the beatles on it (vomit emoji). Freak this song"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/32/4f/fd/324ffda2-9e51-8f6a-0c2d-c6fd2b41ac55/074643811224.jpg/600x600bb.jpg", "consensus": "The best-selling album of all time, widely acclaimed for its polished pop-funk crossover and its string of iconic hits."}, {"rsRank": 19, "artist": "Van Morrison", "album": "Astral Weeks", "year": 1968, "genre": "Rock", "own": false, "will": {"score": 6.75, "notes": "very odd instrumentation and lyricism on the record which keeps it interesting. the standup bass is an awesome choice and the spacey production combined with unpredictable vocals is also cool but overall this album is very inferior to moondance just in terms of melodies. i dont need the 7-10 minute free jazz improvisatory instrumentals over a yap sesh. the way that young lovers do is totally fire and sounds very out of place on the record but i wish the rest of the album sounded like it."}, "mason": {"score": 6.0, "notes": "Moondance is far superior. The people making this list were idiots. Sweet thing, ballerina, madame george, and the title track are the best."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/88/91/1b/88911b7b-a63f-4624-3fb1-2976b628c59a/603497886340.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a mystical, jazz-tinged folk masterpiece, praised for Van Morrison's stream-of-consciousness vocals and songwriting."}, {"rsRank": 18, "artist": "Bruce Springsteen", "album": "Born to Run", "year": 1975, "genre": "Rock", "own": true, "will": {"score": 7.25, "notes": "good record but probably not top 20 good. cool lyrics and melodies for the most part. tenth avenue freeze out and born to run are bangers. she's the one and jungleland also. not a huge fan of the production it's a bit overdone imo"}, "mason": {"score": 7.5, "notes": "Born to be the best springsteen album more like. he has come a long way since the dirty jew music that was tunnel of love. the album has EXACTLY 0 misses. Peaks are thunder road (goated song, cooked movie), backstreets, born to run, and jungle land. he was really cooking here idk how else to put it. it's a lot more gooder than his other stuff. It still has his garbage voice so it can't be any higher than this."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/0a/02/f7/0a02f7a1-ca2a-c0d7-7192-50314971721f/884977157031.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Springsteen record, praised for its cinematic, larger-than-life rock and roll storytelling and title track."}, {"rsRank": 17, "artist": "Nirvana", "album": "Nevermind", "year": 1991, "genre": "Rock", "own": false, "will": {"score": 9.0, "notes": "the grunge record. not really any misses. some songs sound similar but pure energy makes it unnoticeable. this is much more punk than the punk records on here. beatle chord changes over deafening power chords and caustic lyrics."}, "mason": {"score": 9.0, "notes": "The most overrated grunge album of all time. how people prefer this over in utero or stone temple piliots (who somehow aren't on the list???) is beyond me. pretty much everything on this album is a banger except something in the way. best songs are Lithium, lounge act, and in bloom. Smells like teen spirit is kinda mid tbh. I would take on a plain over it any day. This album helped grung become mainstream but it also sold out having very poppy production compared to other grunge."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/95/fd/b9/95fdb9b2-6d2b-92a6-97f2-51c1a6d77f1a/00602527874609.rgb.jpg/1200x630wp-60.jpg", "consensus": "Widely acclaimed as the album that brought grunge to the mainstream, praised for its raw energy and hooks, led by 'Smells Like Teen Spirit.'"}, {"rsRank": 16, "artist": "Bob Dylan", "album": "Blood on the Tracks", "year": 1975, "genre": "Folk", "own": true, "will": {"score": 10.0, "notes": "personal favorite. masterclass in lyricism across the whole record really and the production takes you to a place, especially the tracks from September 1974 in new york with the spacey guitar and bass being the only instruments. scathingly personal lyrics but somehow universal at the same time, my favorite folk record easily. imagery in the lyrics makes it maybe also the best written album of all time."}, "mason": {"score": 6.0, "notes": "This album is dull, pretentious, lacks energy, an is too long. That being said there are a couple of good songs. I'm going to skip over that part though because you obviously ony care about the bad parts. I guess a 6 Isn't good enough for you. The lyrical \"themes\" on display were abysmal and uninspired, despite being from his own life. This album is also so so so boring compared to hwy 61 rev and bringing it all back home. Even desire and frewheelin had more energy and those too were pretty barren. the singing is also some of the worst we've ever seen."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/34/6e/4d/346e4d1c-c9ef-cf7f-96d9-aad97286febb/074643323529.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Dylan record, praised for its raw, emotionally devastating songwriting widely read as a breakup album."}, {"rsRank": 15, "artist": "The Jimi Hendrix Experience", "album": "Are You Experienced", "year": 1967, "genre": "Psychedelic", "own": true, "will": {"score": 9.5, "notes": "guitar was reinvented here. at least 4 inarguable all time classic guitar songs (purple haze, wind cries mary, hey joe, foxy lady). also happens to have like no filler and only bangers. psychedelic rock peak"}, "mason": {"score": 9.5, "notes": "pretty much the perfect phychedelic record. the only problem is may this be love being insanely mid. best songs are hey joe, 3rd stone, and foxy lady. This has got to be the best jimi record and one of the best records of the 60s. I liked how he combined psychedelic with other genres like jazz and blues"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/00/67/45/006745f5-95d5-5a06-35ed-d515e9cfd7d8/dj.tbwlxwoh.jpg/600x600bb.jpg", "consensus": "Widely acclaimed debut, praised for Hendrix's revolutionary guitar work and psychedelic blues-rock songwriting."}, {"rsRank": 14, "artist": "The Beatles", "album": "Abbey Road", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 10.0, "notes": "this is the most 10 of all the 10s on the list. note perfect, no notes"}, "mason": {"score": 6.5, "notes": "Come together and She's so heavy are good. The rest is so consistently meh. Some songs would be worthy of higher ratings but they suffer from overproduction, simple structure, cringe inducing lyrics, and poppy vocals"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/48/53/43/485343e3-dd6a-0034-faec-f4b6403f8108/13UMGIM63890.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Beatles farewell, praised for its polished songwriting and the side-two medley, a fitting studio swan song."}, {"rsRank": 13, "artist": "The Velvet Underground & Nico", "album": "The Velvet Underground & Nico", "year": 1967, "genre": "Psychedelic", "own": false, "will": {"score": 6.5, "notes": "track by track: sunday morning: good track, the celeste is a cool sound and melody is great. waiting for the man: decent but drags. lou reed dylan impression. femme fatale: good song again but i like big star version better cause it feels less disjointed than this. venus in furs: maybe the most experimental song on here, very weird instrumentation and subject matter. run run run: i like this one, the guitar playing is insane and the lyrics are funny. all tomorrows parties: i did not like this one it was kinda boring. heroin: builds up to be an alright song but takes a while to do it. there she goes again: this was alright though its a total rip off of the Stones doing Hitchhike. ill be your mirror: okay song. black angels death song: very dissonant instrumentation which makes it kinda annoying to listen to. european son: absolutely bonkers insane song where the mix explodes a minute in and the next six minutes are guitar noises and feedback. i see why this whole thing was influential but really that doesnt mean i need to listen to it as much as some of the other stuff on here especially since a fair chunk of it is dissonant and unpleasant to the ears"}, "mason": {"score": 4.5, "notes": "This is probably the best record that i would say is actively painful to listen to except yardbirds. femme fatale and sunday morning are alright but they've been done better by other people. europeon son makes me want to do unspeakable acts to my wrists that involve a knife. most of the songs in the middle just kind of suck and are boing and lame and stupid."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/92/93/39/9293397f-a707-237e-ec7e-0ca613a67e3c/06UMGIM04143.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a groundbreaking avant-garde rock debut, praised for its dark, experimental sound and huge influence despite poor initial sales."}, {"rsRank": 12, "artist": "Miles Davis", "album": "Kind of Blue", "year": 1959, "genre": "Jazz", "own": false, "will": {"score": 7.25, "notes": "fine record but I prefer fusion to modal. Freddie freeloader is a banger, and so what. the rest are fine but not exactly mind blowing. in a silent way >>"}, "mason": {"score": 8.5, "notes": "kind of blue? more like kind of goated!!! The best tracks are So What and Freddie Freeloader. This album makes great use of modes which was new in jazz but it sacrificed all the energy from jazz. going from birth of the cool to this feels like walking into a snooze-fest. it's NOT exciting but it is good if you're in a chill mood i guess."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music/7f/9f/d6/mzi.vtnaewef.jpg/600x600bb.jpg", "consensus": "Widely regarded as a jazz masterpiece and one of the best-selling jazz records ever, praised for its modal innovations and cool, spacious sound."}, {"rsRank": 11, "artist": "Elvis Presley", "album": "The Sun Sessions", "year": 1975, "genre": "Rock", "own": false, "will": {"score": 6.25, "notes": "elvis should not be this high are we serious. hes pioneering and all but this is just straight out of that sun records comp from the 350 range of the list. plus half the songs here are from his debut which was at like number 56 already? just keep his debut up here for influence's sake and get rid of this record. its passable but nowhere near #11 all time. thats all right, blue moon of kentucky, good rockin tonight, baby lets play house, blue moon, just because are good."}, "mason": {"score": 5.5, "notes": "See my elvis self titled review. it's basically that except more hits so more better. It's still elvis tho and he's mid"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/c5/83/f0/c583f039-b1b2-cad8-c3e6-1c40026bb4d8/886444095242.jpg/600x600bb.jpg", "consensus": "Widely acclaimed compilation of Presley's foundational Sun Records recordings, praised for capturing the birth of rock and roll."}, {"rsRank": 10, "artist": "The Beatles", "album": "The Beatles (The White Album)", "year": 1968, "genre": "Rock", "own": true, "will": {"score": 10.0, "notes": "if i had to pick one album ever this is the album. so many different styles and they pull em all off. the aura this album has with the blank cover and the overbearing presence of revolution 9 makes it totally unmatched in pure vibes of any other record out there. theres an eerie vibe for a lot of it but really it depends on whatever song youre listening to cause its all fire. favorite album of all time"}, "mason": {"score": 7.0, "notes": "Song by song:( ratings will be divided up by side and averaged) Back in the ussr: ok this one is actually pretty good (8.5). Dear POOPence: this one is just boring. It seems like it could trick a normie into thinking it’s good with its odd bass line and interesting guitar lines but a seasoned music listener could recognize that it’s garbage. The bass is just the same thing on root notes and the lyrics suck. Ok it’s not THAT bad but still! (4). Glass onion: a little better but MF DOOM did it better (5). OBLADIOBLADA: no. this is just pop nonsense with animal sounds? (3). Wild Honey Pie: this is undeserving of a review. Would be a 0 if it wasn’t under a minute (1). Bungalow bill: 7 until yoko ono but she single handedly sacrifices the song. Other than her it’s pretty good (6.5). While my guitar gently weep: Clapton reference so instant best song on album status (10). Happiness is a warm gun: irritating vocals after the first half but not bad before that (5). Martha my dear: kind of mid tbh. Irritating stereo and impoverished vocals (5.5). I’m so tire: Short and not too bad. Nothing special though (6). Blackbird: Pop nonsense. This belongs on a garbage and not good song with the left. . . (2.5). Piggies: HOLY PEAK. It would be a 10 if it wasn’t satire and if it was just a shipost (9). Rocky Raccoon: Story focused song with a garbage story. Whoop dee doo he gets shot now make a song that doesn’t suck (4.5). Don’t pass me by: it’s ok i guess (5). Why don’t we do it in the road: It’s good, nothing all to especially great but it’s good (6.5). I will: Garbage. Pure pop music garbage (3). Julia: William, are these really your goats? This is just a strings and vocals pop song about a dead person. I don’t know how you could ever consider this a “banger”. Please seek help (1). Birthday: It’s better than the OG birthday song so it got done what it needed to get done (8). Yer BLues: you can never go wrong with a generic blues song but this one manages to stay less interesting than any other blues song so there isn’t much of a reason to listen to it (7). M nature son: again, this your goat? This is m-m-m-MID!!! It has the vibe going (will add bonus points) but it utterly fails as an actual track (3). Monkey one: HOLY PEAK!!! It’s not the best late 60s monkey rock song but it’s probably the second best (9). Sexy sadie: no this isn’t it i’m sorry. This is one of those songs where nothing really happens (4). Helter Sk: Not metal at all william, stop posing. It’s pretty good for slide rock though. Blisters are indeed on fingers (8). Long x3, midx3 (4). Revolution 1: it’s like if revolution sucked (5). Honey Pie: Broadway is goated but this is not it gang. Joe Jackson did it better (5.5). Savory Truffle: Nice Lyrics, Nice instrumentals. It’s pretty decenT (7). Cry baby: it’s ok but nothing stands out (6). Numba 9 numba 9: too experimental for its own good. it gets a numba 9 divided by a numba 9 (1). Good night: gospel done wrong (4). Side 1: (5.375). Side 2: (4.778).  Side 3: (6.143). Side 4: (4.75). Side average: (5.2615). Bonus points: (+1.5 vibe points). Overall ranking: (light 7)."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/fa/5b/89/fa5b898d-bad6-e053-4195-260e5c74f2bb/00602567725466.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Beatles double album, praised for its stylistic range and adventurous songwriting, though some find it sprawling."}, {"rsRank": 9, "artist": "Bob Dylan", "album": "Blonde on Blonde", "year": 1966, "genre": "Folk", "own": true, "will": {"score": 9.5, "notes": "its kind of dragged down by the final song which some call his best but i dont think its for me. rest is unbelievably peak psychedelic folk/blues rock. highlights include the bluesy pledging my time, the lyrical odyssey of visions of johanna, the psychedelic storytelling of stuck inside of mobile, the rocking leopard skin pill box hat, the perfectly written just like a woman, the joyous absolutely sweet marie, and the rocking obviously five believers. dunno why he likes to add random adverbs to the front of his songs (absolutely, temporary, obviously). goated songwriter AND vocalist idc"}, "mason": {"score": 7.0, "notes": "It's better than blood on the tracks in terms of energy and lyrics and songwriting (i don't care what that stupid book says. 30/30 my butt) but worse than bringing it all back home. It's also very long and probably a little too long imo. there are some fire tracks like absolutely sweet marie, just like the woman, and that memphis one."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/20/9d/bf/209dbf58-f698-7181-33de-0c29480beba0/074640084126.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Dylan double album, praised for its surreal, electric poetry and rich, band-driven sound."}, {"rsRank": 8, "artist": "The Clash", "album": "London Calling", "year": 1979, "genre": "Punk", "own": false, "will": {"score": 7.0, "notes": "cool mixture of punk, new wave, reggae, pop, etc. top 10 seems quite generous as there is plenty of filler and derivative but I guess it's a double album that you could get entrenched in the atmosphere some so I see how people could dig it more than me. feels like I'll probably like it more with repeated listens. bangers include title track, brand new Cadillac, jimmy jazz, train in vain, revolution rock, rudie can't fail."}, "mason": {"score": 7.5, "notes": "clashaty clash or however that song goes. The first and last ones are amazing. everything in the middle varys from boring to pretty good. ts did not need to be so long"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/93/cb/20/93cb201b-154b-7b74-a10b-48fbef9b3281/888880348937.jpg/600x600bb.jpg", "consensus": "Widely acclaimed double album, praised for its punk urgency blended with reggae, rockabilly and soul influences."}, {"rsRank": 7, "artist": "The Rolling Stones", "album": "Exile on Main St.", "year": 1972, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "fourth double album in a row on the list. its easy to get sucked into a double album cause if you like the atmosphere youll slowly start to like every track and then once you do its just miles ahead of other albums simply because it has twice the amount of bangers. theres really no misses on here except sweet black angel since it has aged comically poorly. lots of all timers here like tumbling dice, rocks off, sweet virginia, rip this joint, shine a light, ventilator blues, happy, loving cup, etc. no frills rock and roll. let it bleed is a single album of high quality songs and this is a double album of high quality songs with just a bit of error but i understand the top 10 placement."}, "mason": {"score": 8.0, "notes": "another album that didn't need to be a double album. The first side is incredible work but the rest lacks behind a little. it's still good but i could have done without tracks like  all down the line and i want to see his face.. I don't see in any world how this could be above let it bleed. It's a lot less consistant and lacks a coherent theme other than destruction which is what needs to happen to this placement."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/7f/e0/b4/7fe0b4da-36cd-a1d0-0f19-ef3fec18e3cd/08UMGIM15742.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Rolling Stones double album, praised for its loose, rootsy, blues-soaked songwriting recorded amid tax exile."}, {"rsRank": 6, "artist": "Marvin Gaye", "album": "What’s Going On", "year": 1971, "genre": "R&B", "own": false, "will": {"score": 9.25, "notes": "nice smooth motowny soul funk. cool vibe on every track which makes the lesser ones interesting still (right on, wholy holy). best tracks are inner city blues, whats happening brother, flyin high, mercy mercy me. endlessly sonically pleasing to listen to"}, "mason": {"score": 9.0, "notes": "Literally every song is a banger. It's one of the first great concept albums and it's about the destruction of the late 60s and early 70s, mainly on the ninja community, seen from the perspective of a vietnam draftee. It talks about 70s ghetto life and how people got the poor as well as a lot of religious themes. This album also basically invented prog soul and helped with that good stuff. Overall goated album. Best songs are first and last ones"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music112/v4/76/36/2d/76362d74-cb7a-8ef9-104e-cde1d858e9a9/20UMGIM95279.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed soul landmark, praised for Marvin Gaye's socially conscious songwriting and lush, seamless production."}, {"rsRank": 5, "artist": "The Beatles", "album": "Rubber Soul", "year": 1965, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "quite peak. irresistable hooks in every section of every song and timeless melodies as well. middle groud between joyous early beatles and experimental late beatles, so we get introspective middle beatles. girl, in my life, michelle, norwegian wood, etc are coolly contemplative with great lyrics. also i just like the jangly guitar tone george has on most tracks and the clean crisp acoustic guitars."}, "mason": {"score": 6.5, "notes": "Drive my car, I'm looking through you, and Run for yourr life are the high lights for sure and most of the rest is just generic beetle-pop and weird mediocre stuff that is not worth of being in a \"top 5 album of all time\". Maybe i just had to be there or something or maybe i need to take up psychodelic drugs to understand this one"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/af/20/aa/af20aa89-4002-11fb-25d8-ff544af67eb4/00602567725404.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Beatles record, praised for its songwriting maturity and pivot toward more introspective folk-influenced pop."}, {"rsRank": 4, "artist": "Bob Dylan", "album": "Highway 61 Revisited", "year": 1965, "genre": "Folk", "own": false, "will": {"score": 9.5, "notes": "banger. totally ditched the folk hero persona and became his own entity. he was totally unmatched by anyone in the music industry at this time and this record solidified it. no misses. could go on about every single song but it boils down to peak instrumentation and peak lyricism."}, "mason": {"score": 9.0, "notes": "Best folk rock album of all time. every song on here is like- worthy and solidly so. the best ones are like a rolling stone (overrated but still good), Tombstone blues (so much aura, probably my favorite bob dylan song), and desolation row (long but in a way that farms aura). this album suffers from  a case of good fold production. the sounds are full but not overwealming, like what plil spector wishes he was. definitely the best bob dylan album and the best folk rock album"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/f8/ff/c0/f8ffc056-55b4-2033-657d-32492d1eea25/827969239926.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Dylan record, praised for its surreal lyricism, blues-rock power and the epic 'Like a Rolling Stone.'"}, {"rsRank": 3, "artist": "The Beatles", "album": "Revolver", "year": 1966, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "influential, pioneering, boundary pushing, insane record. some of my favorites are: taxman, a straight rocker with a great bassline and solo (both from paul.) im only sleeping, incredible song lyrically and musically, backwards guitar solo is awesome and chord progression and yawning in the break. here there and everywhere is a perfect song. tomorrow never knows is an absolutely unheard of song to make in 1966. so many experiments all over the record like the indian instrumentation in love you to, pushing musical limits in the for no one solo, eleanor rigby instrumentation on a rock record, yellow submarines sound collage, entirety of tomorrow never knows, etc."}, "mason": {"score": 5.5, "notes": "Some more silly psychedelic tracks here but they suck more than other albums. still jam packed with the 60s goyslop the rolling stones writers seem to love. The taxman song was probably the best and i can't say any of the others really caught my fancy. yellow submarine is another case of overplayed psychedelic slop"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/97/f4/3a/97f43ab4-9fdf-7a41-e430-7c6c313f3883/13UMGIM63887.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Beatles record, praised for its studio experimentation and songwriting leaps, from 'Eleanor Rigby' to 'Tomorrow Never Knows.'"}, {"rsRank": 2, "artist": "The Beach Boys", "album": "Pet Sounds", "year": 1966, "genre": "Psychedelic", "own": false, "will": {"score": 6.75, "notes": "i think this is kinda overrated i guess. caroline no, god only knows, sloop john b, wouldnt it be nice, etc are good but the melodies and harmonies sound kinda samey and maybe a little too schmaltzy for me. just a watered down sgt pepper even though it came first."}, "mason": {"score": 5.0, "notes": "Wouldn't it be nice is a good song but the whole album is pretty much just generic 60s pop. see previous reviews for \"the beach boys\""}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/35/bb/c4/35bbc4eb-9387-97b0-b138-64b7a949ea43/13UABIM03512.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Beach Boys record, praised as a visionary studio masterpiece and one of the most influential albums in pop history."}, {"rsRank": 1, "artist": "The Beatles", "album": "Sgt. Pepper’s Lonely Hearts Club Band", "year": 1967, "genre": "Psychedelic", "own": true, "will": {"score": 9.5, "notes": "great record. not really anything to criticize here as the composition and instrumentation of every song is top notch. i dont really need she's leaving home personally but its a well written song. obviously very influential what with a day in the life and lucy in the sky and everything. my favorite is lovely rita."}, "mason": {"score": 6.5, "notes": "Starts strong with 3 bangers but quicky goes from psychodelic bangers to boring 60s pop love songs. getting better is unironically the song where it gets worse. A day in the life is the letdown of the century. it is known as this great song but it actually sucks if you listen to it with the reddit tab closed on your computer. so overall, it's a solid concept album for the time but it is neither my thing or something i want to listen to today"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/64/85/d2/6485d219-91ac-5481-2668-7eab1320436d/21UMGIM57007.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a landmark of studio-era pop, praised for its conceptual ambition, though its 'greatest ever' status is often debated."}]</script>
<script>
// ===== Data =====
const RAW_ALBUMS = JSON.parse(document.getElementById('album-data').textContent);

const GENRE_COLORS = {
  'Rock': '#c1443a', 'Hip Hop': '#d9a441', 'Blues': '#3e6e9e', 'Country': '#a97c50',
  'Folk': '#6e8b5a', 'Pop': '#c46b9e', 'Punk': '#e0522a', 'Metal': '#5b5f6b',
  'Jazz': '#4e8aa6', 'Soul': '#b5566b', 'Funk': '#d6a72a', 'R&B': '#9e5fa3',
  'Indie': '#7d8fc4', 'Psychedelic': '#9457b8', 'Prog': '#4e9c7a', 'Electronic': '#3fb6a8',
  'Reggae': '#4fa35a', 'Unknown': '#6b6b6b'
};
function genreColor(g){ return GENRE_COLORS[g] || '#8f8676'; }

// working in-memory list
let albums = RAW_ALBUMS.map(a => ({...a}));
const byRank = {};
albums.forEach(a => byRank[a.rsRank] = a);

// ===== Cover art =====
// Static, pre-resolved URLs only — no runtime network calls. The sandbox this
// page can run in blocks essentially all outbound fetch/script requests, so
// any live lookup (tried three different ways) silently failed. Albums with a
// verified real coverUrl show it directly; everything else gets a designed
// placeholder (below) rather than a blank box or bare text.
function attachLazyCover(imgEl, fallbackEl, album){
  if (album.coverUrl){
    imgEl.onload = () => imgEl.classList.add('loaded');
    imgEl.onerror = () => { if (fallbackEl) fallbackEl.classList.add('show'); };
    imgEl.src = album.coverUrl;
  } else if (fallbackEl){
    fallbackEl.classList.add('show');
  }
}

// ===== State =====
let state = {
  search: '',
  sort: 'rs',
  genre: 'All',
  ownOnly: false,
  compact: false,
};

// ===== Genre rail =====
const genreCounts = {};
albums.forEach(a => { genreCounts[a.genre] = (genreCounts[a.genre]||0) + 1; });
const genreList = Object.keys(genreCounts).sort((a,b) => genreCounts[b]-genreCounts[a]);

function renderGenreRail(){
  const rail = document.getElementById('genreRail');
  const allTab = `<button class="gtab ${state.genre==='All'?'active':''}" data-genre="All" style="color:${state.genre==='All'?'var(--cream)':''}">
    <span class="dot" style="background:var(--signal)"></span>All <span class="count">${albums.length}</span>
  </button>`;
  const tabs = genreList.map(g => `
    <button class="gtab ${state.genre===g?'active':''}" data-genre="${g}" style="${state.genre===g ? 'color:'+genreColor(g)+';border-color:'+genreColor(g) : ''}">
      <span class="dot" style="background:${genreColor(g)}"></span>${g} <span class="count">${genreCounts[g]}</span>
    </button>`).join('');
  rail.innerHTML = allTab + tabs;
  rail.querySelectorAll('.gtab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.genre = btn.dataset.genre;
      render();
    });
  });
}

// ===== Filtering / Sorting =====
function getFiltered(){
  let list = albums.slice();
  if (state.genre !== 'All') list = list.filter(a => a.genre === state.genre);
  if (state.ownOnly) list = list.filter(a => a.own);
  if (state.search.trim()){
    const q = state.search.trim().toLowerCase();
    list = list.filter(a => a.artist.toLowerCase().includes(q) || a.album.toLowerCase().includes(q));
  }
  return list;
}

function sortList(list){
  const s = state.sort;
  const copy = list.slice();
  if (s === 'rs') copy.sort((a,b) => a.rsRank - b.rsRank);
  else if (s === 'will') copy.sort((a,b) => (b.will.score||0) - (a.will.score||0));
  else if (s === 'mason') copy.sort((a,b) => (b.mason.score||0) - (a.mason.score||0));
  else if (s === 'year-desc') copy.sort((a,b) => (b.year||0) - (a.year||0));
  else if (s === 'year-asc') copy.sort((a,b) => (a.year||0) - (b.year||0));
  else if (s === 'artist') copy.sort((a,b) => a.artist.localeCompare(b.artist));
  else copy.sort((a,b) => a.rsRank - b.rsRank); // genre grouping handled by caller
  return copy;
}

// ===== Rendering =====
function cardHTML(a){
  return `
  <div class="card" tabindex="0" data-rank="${a.rsRank}">
    <div class="cover-wrap">
      <img alt="${escapeHtml(a.album)} cover">
      <div class="cover-fallback"><div class="fallback-disc" style="--fc:${genreColor(a.genre)}"></div><div class="fallback-title">${escapeHtml(titleCase(a.album))}</div><div class="fallback-artist">${escapeHtml(titleCase(a.artist))}</div></div>
      <span class="rank-badge">RS #${a.rsRank}</span>
      ${a.own ? '<span class="own-badge">OWN</span>' : ''}
    </div>
    <div class="card-meta">
      <div class="artist">${escapeHtml(titleCase(a.artist))}</div>
      <div class="album">${escapeHtml(titleCase(a.album))}</div>
      <div class="scoreline">
        <span class="lbl">W</span><b>${fmtScore(a.will.score)}</b>
        <span class="lbl">M</span><b>${fmtScore(a.mason.score)}</b>
      </div>
    </div>
  </div>`;
}

function fmtScore(v){
  if (v === null || v === undefined || isNaN(v)) return '—';
  return (Math.round(v*100)/100).toString();
}
function titleCase(s){
  if (!s) return '';
  // preserve already-capitalized strings (Anna/Will data mixes case); apply title case only to all-lowercase strings
  if (s === s.toLowerCase()){
    return s.replace(/\w\S*/g, t => t.charAt(0).toUpperCase() + t.substring(1));
  }
  return s;
}
function escapeHtml(s){
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function render(){
  renderGenreRail();
  const content = document.getElementById('content');
  const filtered = getFiltered();
  document.getElementById('countLabel').textContent = `${filtered.length} album${filtered.length!==1?'s':''}${state.genre!=='All' ? ' · ' + state.genre : ''}`;

  if (filtered.length === 0){
    content.innerHTML = `<div class="empty-state">No albums match “${escapeHtml(state.search)}”</div>`;
    return;
  }

  let html = '';
  if (state.sort === 'genre' && state.genre === 'All'){
    // group by genre, sections ordered by count desc, each internally by RS rank
    genreList.forEach(g => {
      const group = filtered.filter(a => a.genre === g).sort((a,b)=>a.rsRank-b.rsRank);
      if (!group.length) return;
      html += `<div class="section-head"><span class="swatch" style="background:${genreColor(g)}"></span><h2>${g}</h2><span class="n">${group.length} album${group.length!==1?'s':''}</span></div>`;
      html += `<div class="grid">${group.map(cardHTML).join('')}</div>`;
    });
  } else {
    const sorted = sortList(filtered);
    const sortLabels = {
      rs: 'Rolling Stone Order', will: "Sorted by Will's Rating", mason: "Sorted by Mason's Rating",
      'year-desc': 'Sorted by Year (Newest)', 'year-asc': 'Sorted by Year (Oldest)', artist: 'Sorted A–Z'
    };
    const label = state.genre !== 'All' ? state.genre : (sortLabels[state.sort] || 'Results');
    html += `<div class="section-head"><span class="swatch" style="background:${genreColor(state.genre==='All'?'Unknown':state.genre)}"></span><h2>${label}</h2><span class="n">${sorted.length} album${sorted.length!==1?'s':''}</span></div>`;
    html += `<div class="grid">${sorted.map(cardHTML).join('')}</div>`;
  }
  content.innerHTML = html;

  // wire up cards
  content.querySelectorAll('.card').forEach(card => {
    const rank = parseInt(card.dataset.rank);
    const a = byRank[rank];
    const img = card.querySelector('img');
    const fb = card.querySelector('.cover-fallback');
    attachLazyCover(img, fb, a);
    card.addEventListener('click', () => openDrawer(rank));
    card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openDrawer(rank); });
  });
}

// ===== Drawer / Detail =====
const scrim = document.getElementById('scrim');
const drawer = document.getElementById('drawer');

function openDrawer(rank){
  const a = byRank[rank];
  renderDrawer(a);
  scrim.classList.add('open');
  drawer.classList.add('open');
  drawer.scrollTop = 0;
}

function closeDrawer(){
  scrim.classList.remove('open');
  drawer.classList.remove('open');
}
document.getElementById('closeDrawer').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });

function renderDrawer(a){
  document.getElementById('drawerCounter').textContent = `RS #${a.rsRank} of 500`;
  const gc = genreColor(a.genre);
  const body = document.getElementById('drawerBody');

  body.innerHTML = `
    <div class="detail-head">
      <div class="detail-cover"><img alt="cover"><div class="cover-fallback"><div class="fallback-disc" style="--fc:${gc}"></div><div class="fallback-title">${escapeHtml(titleCase(a.album))}</div><div class="fallback-artist">${escapeHtml(titleCase(a.artist))}</div></div></div>
      <div class="detail-title-block">
        <span class="genre-chip" style="color:${gc}">${a.genre}</span>
        <div class="detail-artist">${escapeHtml(titleCase(a.artist))}</div>
        <div class="detail-album">${escapeHtml(titleCase(a.album))}</div>
        <div class="detail-year">${a.year || '—'}</div>
      </div>
    </div>

    <div class="scoreboard">
      <div class="score-cell will"><div class="who">Will</div><div class="val">${fmtScore(a.will.score)}<small>/10</small></div></div>
      <div class="score-cell mason"><div class="who">Mason</div><div class="val">${fmtScore(a.mason.score)}<small>/10</small></div></div>
    </div>

    <div class="own-line">${a.own ? '● In the collection' : '○ Not owned'}</div>

    ${a.consensus ? `
    <div class="field">
      <div class="field-label">Critical Consensus</div>
      <div class="notes-text">${escapeHtml(a.consensus)}</div>
    </div>` : ''}

    <div class="field">
      <div class="field-label"><span class="who-tag will">WILL</span></div>
      <div class="notes-text">${escapeHtml(a.will.notes) || '<em style="color:var(--dust-dim)">No notes yet.</em>'}</div>
    </div>

    <div class="field">
      <div class="field-label"><span class="who-tag mason">MASON</span></div>
      <div class="notes-text">${escapeHtml(a.mason.notes) || '<em style="color:var(--dust-dim)">No notes yet.</em>'}</div>
    </div>

    ${a.tracks && a.tracks.length ? `
    <div class="field">
      <div class="field-label">Track Listing</div>
      <div class="tracklist">
        ${a.tracks.map((t,i) => `<div class="track-row"><span class="track-num">${i+1}.</span><span class="track-name">${escapeHtml(t.name)}</span><span class="track-time">${t.time||''}</span></div>`).join('')}
      </div>
    </div>` : ''}
  `;

  const img = body.querySelector('.detail-cover img');
  const fb = body.querySelector('.detail-cover .cover-fallback');
  attachLazyCover(img, fb, a);
}

// ===== Controls wiring =====
document.getElementById('searchInput').addEventListener('input', (e) => {
  state.search = e.target.value;
  render();
});
document.getElementById('sortSelect').addEventListener('change', (e) => {
  state.sort = e.target.value;
  render();
});
document.getElementById('ownToggle').addEventListener('click', (e) => {
  state.ownOnly = !state.ownOnly;
  e.target.classList.toggle('active', state.ownOnly);
  render();
});
document.getElementById('compactToggle').addEventListener('click', (e) => {
  state.compact = !state.compact;
  e.target.classList.toggle('active', state.compact);
  document.getElementById('content').classList.toggle('compact', state.compact);
});
document.getElementById('randomBtn').addEventListener('click', () => {
  const pick = albums[Math.floor(Math.random() * albums.length)];
  openDrawer(pick.rsRank);
});

// ===== Stats view =====
let statsMode = false;

function pearsonCorrelation(xs, ys){
  const n = xs.length;
  if (n < 2) return null;
  const meanX = xs.reduce((a,b)=>a+b,0) / n;
  const meanY = ys.reduce((a,b)=>a+b,0) / n;
  let num = 0, denX = 0, denY = 0;
  for (let i=0;i<n;i++){
    const dx = xs[i]-meanX, dy = ys[i]-meanY;
    num += dx*dy; denX += dx*dx; denY += dy*dy;
  }
  if (denX === 0 || denY === 0) return null;
  return num / Math.sqrt(denX*denY);
}

function computeStats(){
  const withBoth = albums.filter(a => typeof a.will.score === 'number' && typeof a.mason.score === 'number' && !isNaN(a.will.score) && !isNaN(a.mason.score));

  const willScores = withBoth.map(a => a.will.score);
  const masonScores = withBoth.map(a => a.mason.score);
  const rsRanks = withBoth.map(a => a.rsRank);

  const avgWill = willScores.reduce((a,b)=>a+b,0) / willScores.length;
  const avgMason = masonScores.reduce((a,b)=>a+b,0) / masonScores.length;
  const ownedCount = albums.filter(a => a.own).length;

  const willMasonCorr = pearsonCorrelation(willScores, masonScores);
  // invert rank so "higher = RS liked it more", for an intuitive correlation sign
  const rsScoreLike = rsRanks.map(r => 501 - r);
  const willRsCorr = pearsonCorrelation(willScores, rsScoreLike);
  const masonRsCorr = pearsonCorrelation(masonScores, rsScoreLike);

  // genre aggregates
  const genreAgg = {};
  albums.forEach(a => {
    if (!genreAgg[a.genre]) genreAgg[a.genre] = {count:0, willSum:0, willN:0, masonSum:0, masonN:0};
    const g = genreAgg[a.genre];
    g.count++;
    if (typeof a.will.score === 'number' && !isNaN(a.will.score)){ g.willSum += a.will.score; g.willN++; }
    if (typeof a.mason.score === 'number' && !isNaN(a.mason.score)){ g.masonSum += a.mason.score; g.masonN++; }
  });
  const genresSorted = Object.keys(genreAgg).sort((a,b) => genreAgg[b].count - genreAgg[a].count);

  // decade aggregates
  const decadeAgg = {};
  withBoth.forEach(a => {
    if (!a.year) return;
    const dec = Math.floor(a.year/10)*10;
    if (!decadeAgg[dec]) decadeAgg[dec] = {willSum:0, masonSum:0, n:0};
    decadeAgg[dec].willSum += a.will.score;
    decadeAgg[dec].masonSum += a.mason.score;
    decadeAgg[dec].n++;
  });
  const decadesSorted = Object.keys(decadeAgg).map(Number).sort((a,b)=>a-b);

  // biggest disagreements
  const disagreements = withBoth
    .map(a => ({...a, diff: Math.abs(a.will.score - a.mason.score)}))
    .sort((a,b) => b.diff - a.diff)
    .slice(0, 10);

  // biggest agreements (smallest gap)
  const agreements = withBoth
    .map(a => ({...a, diff: Math.abs(a.will.score - a.mason.score)}))
    .sort((a,b) => a.diff - b.diff)
    .slice(0, 10);

  // top rated by each
  const topWill = albums.filter(a => typeof a.will.score === 'number').slice().sort((a,b) => b.will.score - a.will.score).slice(0, 10);
  const topMason = albums.filter(a => typeof a.mason.score === 'number').slice().sort((a,b) => b.mason.score - a.mason.score).slice(0, 10);

  // head-to-head: who rates higher, how often
  let willHigherCount = 0, masonHigherCount = 0, tiedCount = 0;
  withBoth.forEach(a => {
    if (a.will.score > a.mason.score) willHigherCount++;
    else if (a.mason.score > a.will.score) masonHigherCount++;
    else tiedCount++;
  });

  // standard deviation (consistency / how harsh-vs-generous the spread is)
  function stdDev(arr, mean){
    const variance = arr.reduce((sum,v) => sum + (v-mean)**2, 0) / arr.length;
    return Math.sqrt(variance);
  }
  const willStdDev = stdDev(willScores, avgWill);
  const masonStdDev = stdDev(masonScores, avgMason);

  // score distribution buckets (0-1, 1-2, ... 9-10)
  const buckets = Array.from({length:10}, (_,i) => i);
  const willDist = buckets.map(b => willScores.filter(v => v >= b && (b===9 ? v<=10 : v<b+1)).length);
  const masonDist = buckets.map(b => masonScores.filter(v => v >= b && (b===9 ? v<=10 : v<b+1)).length);

  // owned vs not-owned average score (using Will's score, since ownership tracks his collection)
  const ownedScores = albums.filter(a => a.own && typeof a.will.score === 'number').map(a => a.will.score);
  const notOwnedScores = albums.filter(a => !a.own && typeof a.will.score === 'number').map(a => a.will.score);
  const avgOwnedScore = ownedScores.length ? ownedScores.reduce((a,b)=>a+b,0)/ownedScores.length : 0;
  const avgNotOwnedScore = notOwnedScores.length ? notOwnedScores.reduce((a,b)=>a+b,0)/notOwnedScores.length : 0;

  // biggest disagreements with Rolling Stone: combined (Will+Mason) average score,
  // vs RS rank rescaled to the same 0-10 range, so the two are directly comparable.
  // Positive rsDiff = we rate it higher than RS placed it; negative = RS rated it higher than us.
  const rsDisagreements = withBoth.map(a => {
    const combined = (a.will.score + a.mason.score) / 2;
    const rsScaled = ((501 - a.rsRank) / 500) * 10;
    return {...a, combined, rsScaled, rsDiff: combined - rsScaled};
  }).sort((a,b) => Math.abs(b.rsDiff) - Math.abs(a.rsDiff)).slice(0, 12);

  return {
    withBoth, avgWill, avgMason, ownedCount,
    willMasonCorr, willRsCorr, masonRsCorr,
    genreAgg, genresSorted, decadeAgg, decadesSorted, disagreements,
    agreements, topWill, topMason,
    willHigherCount, masonHigherCount, tiedCount,
    willStdDev, masonStdDev,
    buckets, willDist, masonDist,
    avgOwnedScore, avgNotOwnedScore, ownedScores, notOwnedScores,
    rsDisagreements
  };
}

// ===== SVG chart helpers (no external library — self-contained so nothing
// depends on a CDN being reachable) =====
function svgEl(tag, attrs){
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

function barChart({labels, series, min=0, max, horizontal=false, height=280}){
  // series: [{name, color, values}]
  const w = 640, h = height;
  const padL = horizontal ? 110 : 36, padR = 14, padT = 14, padB = horizontal ? 14 : 60;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  max = max ?? Math.max(1, ...series.flatMap(s => s.values));
  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, style:'width:100%; height:100%;'});

  const n = labels.length;
  const groupCount = series.length;
  if (horizontal){
    const barH = Math.min(22, (plotH / n) * 0.6);
    const gap = plotH / n;
    labels.forEach((label, i) => {
      const cy = padT + gap * i + gap/2;
      svg.appendChild(svgEl('text', {x:padL-8, y:cy+4, 'text-anchor':'end', fill:'#8f8676', 'font-size':11, 'font-family':'IBM Plex Mono, monospace'})).textContent = label;
      series.forEach((s, si) => {
        const val = s.values[i];
        const bw = (val/max) * plotW;
        const by = cy - barH/2 + si*(barH/groupCount) - (groupCount>1?barH/2 - barH/(2*groupCount):0);
        const rect = svgEl('rect', {x:padL, y: cy - (groupCount>1? barH/2 : barH/2), width:Math.max(1,bw), height: groupCount>1? barH/groupCount - 2 : barH, rx:2, fill:s.color});
        if (groupCount>1) rect.setAttribute('y', cy - barH/2 + si*(barH/groupCount));
        svg.appendChild(rect);
      });
    });
  } else {
    const gap = plotW / n;
    const barW = Math.min(28, gap * 0.6) / groupCount;
    labels.forEach((label, i) => {
      const cx = padL + gap * i + gap/2;
      svg.appendChild(svgEl('text', {x:cx, y:h-padB+16, 'text-anchor':'middle', fill:'#8f8676', 'font-size':10, 'font-family':'IBM Plex Mono, monospace', transform:`rotate(45 ${cx} ${h-padB+16})`})).textContent = label;
      series.forEach((s, si) => {
        const val = s.values[i];
        const bh = (Math.max(0,val)/max) * plotH;
        const bx = cx - (barW*groupCount)/2 + si*barW;
        svg.appendChild(svgEl('rect', {x:bx, y:padT+plotH-bh, width:Math.max(1,barW-2), height:Math.max(0,bh), rx:2, fill:s.color}));
      });
    });
    // baseline
    svg.appendChild(svgEl('line', {x1:padL, y1:padT+plotH, x2:w-padR, y2:padT+plotH, stroke:'#332e26'}));
  }
  return svg;
}

function lineChart({labels, series, min=0, max, height=280}){
  const w = 640, h = height, padL = 36, padR = 14, padT = 14, padB = 30;
  const plotW = w - padL - padR, plotH = h - padT - padB;
  max = max ?? Math.max(1, ...series.flatMap(s => s.values));
  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, style:'width:100%; height:100%;'});
  const n = labels.length;
  const stepX = n > 1 ? plotW/(n-1) : 0;

  // gridlines
  for (let gy=0; gy<=4; gy++){
    const y = padT + (plotH/4)*gy;
    svg.appendChild(svgEl('line', {x1:padL, y1:y, x2:w-padR, y2:y, stroke:'#241f1a'}));
  }
  labels.forEach((label, i) => {
    const x = padL + stepX*i;
    svg.appendChild(svgEl('text', {x, y:h-8, 'text-anchor':'middle', fill:'#8f8676', 'font-size':10, 'font-family':'IBM Plex Mono, monospace'})).textContent = label;
  });
  series.forEach(s => {
    const pts = s.values.map((v,i) => `${padL+stepX*i},${padT + plotH - (v/max)*plotH}`).join(' ');
    svg.appendChild(svgEl('polyline', {points:pts, fill:'none', stroke:s.color, 'stroke-width':2}));
    s.values.forEach((v,i) => {
      svg.appendChild(svgEl('circle', {cx:padL+stepX*i, cy:padT + plotH - (v/max)*plotH, r:3, fill:s.color}));
    });
  });
  return svg;
}

function scatterChart({points, height=380}){
  const w = 640, h = height, pad = 40;
  const plotW = w - pad*2, plotH = h - pad*2;
  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, style:'width:100%; height:100%;'});
  const toX = v => pad + (v/10)*plotW;
  const toY = v => pad + plotH - (v/10)*plotH;

  for (let g=0; g<=10; g+=2){
    svg.appendChild(svgEl('line', {x1:toX(g), y1:pad, x2:toX(g), y2:pad+plotH, stroke:'#241f1a'}));
    svg.appendChild(svgEl('line', {x1:pad, y1:toY(g), x2:pad+plotW, y2:toY(g), stroke:'#241f1a'}));
    svg.appendChild(svgEl('text', {x:toX(g), y:pad+plotH+16, 'text-anchor':'middle', fill:'#8f8676', 'font-size':10, 'font-family':'IBM Plex Mono, monospace'})).textContent = g;
    svg.appendChild(svgEl('text', {x:pad-8, y:toY(g)+4, 'text-anchor':'end', fill:'#8f8676', 'font-size':10, 'font-family':'IBM Plex Mono, monospace'})).textContent = g;
  }
  svg.appendChild(svgEl('line', {x1:toX(0), y1:toY(0), x2:toX(10), y2:toY(10), stroke:'#5e574a', 'stroke-dasharray':'4,4'}));
  svg.appendChild(svgEl('text', {x:w/2, y:h-2, 'text-anchor':'middle', fill:'#5e574a', 'font-size':10, 'font-family':'IBM Plex Mono, monospace'})).textContent = "Will's score →";
  svg.appendChild(svgEl('text', {x:10, y:h/2, 'text-anchor':'middle', fill:'#5e574a', 'font-size':10, 'font-family':'IBM Plex Mono, monospace', transform:`rotate(-90 10 ${h/2})`})).textContent = "Mason's score →";

  points.forEach(p => {
    const c = svgEl('circle', {cx:toX(p.x), cy:toY(p.y), r:4, fill:p.color, opacity:0.85});
    const title = svgEl('title', {});
    title.textContent = p.label;
    c.appendChild(title);
    svg.appendChild(c);
  });
  return svg;
}

function radarChart({labels, series, max=10, height=440}){
  // series: [{name, color, values}] — values.length === labels.length
  const w = 640, h = height;
  const cx = w/2, cy = h/2;
  const radius = Math.min(w,h)/2 - 70;
  const n = labels.length;
  const angleFor = i => (Math.PI*2 * i / n) - Math.PI/2;
  const svg = svgEl('svg', {viewBox:`0 0 ${w} ${h}`, style:'width:100%; height:100%;'});

  // concentric rings
  for (let ring=1; ring<=4; ring++){
    const r = radius * (ring/4);
    const pts = labels.map((_,i) => {
      const a = angleFor(i);
      return `${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`;
    }).join(' ');
    svg.appendChild(svgEl('polygon', {points:pts, fill:'none', stroke:'#241f1a'}));
  }
  // spokes + labels
  labels.forEach((label, i) => {
    const a = angleFor(i);
    const x2 = cx+Math.cos(a)*radius, y2 = cy+Math.sin(a)*radius;
    svg.appendChild(svgEl('line', {x1:cx, y1:cy, x2, y2, stroke:'#241f1a'}));
    const lx = cx+Math.cos(a)*(radius+20), ly = cy+Math.sin(a)*(radius+20);
    svg.appendChild(svgEl('text', {x:lx, y:ly+4, 'text-anchor':'middle', fill:'#8f8676', 'font-size':11, 'font-family':'IBM Plex Mono, monospace'})).textContent = label;
  });
  // series polygons
  series.forEach(s => {
    const pts = s.values.map((v,i) => {
      const a = angleFor(i);
      const r = radius * (Math.max(0,Math.min(max,v))/max);
      return `${cx+Math.cos(a)*r},${cy+Math.sin(a)*r}`;
    }).join(' ');
    svg.appendChild(svgEl('polygon', {points:pts, fill:s.color, opacity:0.18, stroke:s.color, 'stroke-width':2}));
    s.values.forEach((v,i) => {
      const a = angleFor(i);
      const r = radius * (Math.max(0,Math.min(max,v))/max);
      svg.appendChild(svgEl('circle', {cx:cx+Math.cos(a)*r, cy:cy+Math.sin(a)*r, r:3, fill:s.color}));
    });
  });
  return svg;
}

function mountChart(id, svg){
  const el = document.getElementById(id);
  if (!el) return;
  el.innerHTML = '';
  el.appendChild(svg);
}

// ===== Background mosaic =====
// Tiled from real album covers where we have them (falls back to a genre-
// colored tile otherwise), sized to comfortably cover any screen and cycling
// through the list if there are fewer tiles than slots. As more real covers
// get filled in over time, this fills in and gets richer automatically.
function renderBackgroundMosaic(){
  const el = document.getElementById('bgMosaic');
  if (!el || !albums.length) return;
  const cols = Math.ceil(window.innerWidth / 110) + 1;
  const rows = Math.ceil(window.innerHeight / 110) + 1;
  const tileCount = Math.min(cols * rows, 900);
  let html = '';
  for (let i = 0; i < tileCount; i++){
    const a = albums[i % albums.length];
    if (a.coverUrl){
      html += `<div class="tile" style="background-image:url('${a.coverUrl}')"></div>`;
    } else {
      html += `<div class="tile" style="background:${genreColor(a.genre)}"></div>`;
    }
  }
  el.innerHTML = html;
}
renderBackgroundMosaic();
window.addEventListener('resize', () => {
  clearTimeout(window.__mosaicResizeT);
  window.__mosaicResizeT = setTimeout(renderBackgroundMosaic, 300);
});

render();
