"score": 4.0, "notes": "another boring young record. how T.F. is this better than Harvest exactly? it doesn't even have peak (Heart Of Gold) on it"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/88/9f/0a/889f0afc-ca89-5968-ef83-ab07f7184eb6/093624924753.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Neil Young record, praised for its intimate, piano-driven songwriting and quiet emotional depth."}, {"rsRank": 73, "artist": "Led Zeppelin", "album": "Physical Graffiti", "year": 1975, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "im a sucker for a good double album. the first disc of this album is a 10 and the second disc is a 9.5 so this evens it out. Custard pie is an all time great rock song with a killer riff, Led Zeppelin timing with the drums and guitar interplay, great classic rock and roll double entendre lyrics, and an awesome wah solo. the rover has more really interesting lyrics that could conceivably be super deep or just straight yap but sold by plants crazy delivery. In my time of dying is one of the best songs of all time, it straight up sounds like the rapture is happening and then it ends so goofily and brings it back down to earth. houses of the holy is another straight rock song with a great riff and guitar licks. Trampled under foot has a great groove and one of the best piano solos ever. Kashmir is a classic I don't even need to say anything except how cool and menacing the riff is and how great the drum fills are. in the light is probably my least favorite song on the record but it's still alright. Picks up in the last half when the countermelody kicks in. Bron-yr-aur is a nice guitar interlude but inferior to bron-yr-aur stomp from III. Down by the seaside has a great riff and cool change in the middle. Ten years gone has some of their craziest lyrics that really do just sound like straight yap that you have to be high to understand probably. Night flight has a cool Four Sticks type driving guitar drum interlock that makes so many Led Zeppelin tracks really cool to listen to, and so does the wanton song except with a much much cooler riff. Boogie with Stu is a stupidly fun jam that's blatantly ripped off from Richie Valens' Ooh My Head but at least they paid the royalties this time. Black country woman is a cool song recorded outside and it's cool to hear the behind the scenes banter (a plane flying overhead that Jimmy page tells the engineer to leave in.) finally, sick again is a creeper rock song but with cool instrumentation and kinda closes out the album with a slightly weaker song but overall the quality of songs are quite peak. I guess with a double album there's more room for error and with so many good songs it's hard not to give the album a lot of credit."}, "mason": {"score": 8.5, "notes": "record 1 is 9.5 record 2 is 7. This is just too long for its own good and ends up falling apart. the first record is immaculate tho"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/82/6c/5d/826c5d66-67b7-62f2-4d78-dd3c7b415e08/dj.pifhrvpa.jpg/600x600bb.jpg", "consensus": "Widely acclaimed double album, praised for its sprawling ambition and range, from heavy blues-rock to acoustic and Eastern-tinged experiments."}, {"rsRank": 72, "artist": "Curtis Mayfield", "album": "Superfly", "year": 1972, "genre": "Soul", "own": true, "will": {"score": 7.5, "notes": "freddie's dead, superfly, and pusherman are peak and the rest are alright to middling."}, "mason": {"score": 9.0, "notes": "Tecnically a concept album but this is really just some of the greatest prog soul music of all time. Freddy's dead, Superfly. and Pusherman are of course the 3 big hits on this and the best ones but some of the deeper cuts are very good like little child and cocaine song. The rest of the album acts more like score and every last bit of it is great"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/c4/34/f0/c434f094-4c7e-3c62-8f15-cd02028e1ce7/603497885978.jpg/600x600bb.jpg", "consensus": "Widely acclaimed blaxploitation soundtrack, praised for Mayfield's socially conscious songwriting and funky, orchestral arrangements."}, {"rsRank": 71, "artist": "Paul Simon", "album": "Graceland", "year": 1986, "genre": "Rock", "own": true, "will": {"score": 9.5, "notes": "fire. the controversy here would be that it is kinda gentrification of indigneous african music like soweto but i would say its a net positive since its clearly him expressing his admiration for the musical styles and all it did was help explode the popularity and recognition of the genre through the enormous success of the album. he also helped skyrocket the careers of all the south african bands he featured on like every track of the record (ladysmith black mambazo especially). anyway if nelson mandela himself personally invited paul simon to perform im gonna go ahead and say this record existing is a net good. anyway it opens with my least favorite track just cause it sounds super duper 80s but the lyrics are weird and funny. i think the record shouldve opened with diamonds on the soles of her shoes and the side shouldve ended with i know what i know but whatever. the title track is one of the best songs ever, lyrically and the way it chugs along. weird how the title is in reference to elvis and america while the unavoidable sound of the whole record is from the opposite side of the planet. i know what i know and gumboots are two great soweto style songs with stream of consciousness type lyrics where it sounds like hes just yapping which is one of my favorite parts about this record. \"i said hey senorita, thats astute, why dont we get together and call ourselves an institute?\", \"dont i know you from the cinematographer's party\", \"believing i had supernatural powers, i slammed into a brick wall\", etc. diamonds on the soles of her shoes is absolutely and totally peak. perfect fusion of african styles and paul simon melodies and lyrics. you can call me al is the clear single of the album, more commercial than anything else but still has quirks like the forward/reversed bass solo, and the delivery of the vocal line is subtly but incredibly weird like steely dan's reelin in the years. under african skies is the first serious lyrical mention of the musical elements of the album, and the theme continues with homeless, which is almost more a ladysmith black mambazo song than a paul simon one and both attempt to call attention to apartheid rule in south africa. the last three songs are all goofy rock songs, especially that was your mother, the sax solo is insanely peak. overall the record is a groudbreaking and influential mixture of two worlds, took a big risk to make this record by breaking the cultural boycott in apartheid south africa but it helped popularize african music in the mainstream which is great because it slaps."}, "mason": {"score": 3.0, "notes": "Watered down afro beats with a disgusting coat of 80s production paint. it makes me sick to the stomach to listen to this thin sounding commercial goyslop. to each their own i guess"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/a7/73/c1/a773c1f0-281c-324c-204f-540444080ea8/886443445697.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a world-music landmark, praised for Simon's fusion of pop songwriting with South African rhythms, despite some political controversy."}, {"rsRank": 70, "artist": "Billy Joel", "album": "The Stranger", "year": 1977, "genre": "Rock", "own": true, "will": {"score": 10.0, "notes": "no misses. i have to give it a 10 because every section of every song has a musically interesting and interesting melody that is pleasing to listen to and what more could you want from a record honestly. the \"and it seems such a waste of time\" part of movin out is what got me hooked on Joel idk why but that part gets me every time. Lyrics on the song are so real as well. Love the spooky western whistler theme that opens the title track and love the guitars and lyrics to the song even more. effortlessly cool and weird song that makes you look at the album cover and wonder what bro is yapping about. Just the way you are is a note perfect love song with a great premise, vocals, and sax solo. Scenes is a great and dramatic mini suite about Brenda and Eddie (though his new york accent makes it sound like Brenda Rinetti) and shares some themes with the title track and movin out. nice neat rock opera condensed into a three part 8 minute tune. he doesn't give you time to catch your breath (unless you're listening on vinyl) before it goes into Vienna which is now a torch song for gen z and it's got the same theme as movin out again where you have to take a break from the rat race and enjoy your life before you get overwhelmed in materialistic stuff that doesn't matter as much as happiness. Only the good die young is a classic creeper rock song though in his defense the girl in the song totally rejects him since the character in the song is a creep trying to hit on an underage catholic schoolgirl. Great music and horns on this one. She's always a woman is another ballad with a fantastic melody and lyrics to match. Dunno what else to say but this guy knows how to write em. Get it right the first time is another good rocker about putting yourself out there or something idk. drums are good on this and the goofy \"lie la lie lie\" singing he does. Last song is everybody has a dream which is like Until the Night if it actually had soul and a payoff to its buildup. This sounds like a gospel song and he's just flexing his vocal range here like on the title track of innocent man. Love how the record ends with a reprise of the theme, wraps it up nicely. Cannot think of a single criticism to make towards the record so it gets a 10."}, "mason": {"score": 8.0, "notes": "pretty good piano rock album (nowhere CLOSE to elton john).Best songs are movin out, title track, only the good die young, and shes always a woman. Everybody has a dream is MID and so is just the way you are. Movin out almost gave me a heart attack ack ack ack (reerence). This album would be better if it was better."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/37/68/4c/37684c52-dbdf-9bfe-0d87-07492f43dc4c/dj.gmcbwich.jpg/600x600bb.jpg", "consensus": "A commercial and critical success, praised for its piano-driven pop craft and hits like 'Just the Way You Are' and 'Only the Good Die Young.'"}, {"rsRank": 69, "artist": "Led Zeppelin", "album": "[Led Zeppelin IV]", "year": 1971, "genre": "Rock", "own": true, "will": {"score": 9.25, "notes": "this would probably be ranking higher if I hadn't heard half these songs to death since age 4 but I can't give it under a 9 still. I never really was a fan of the battle of evermore and that's a lengthy chunk of the record but other than that there's nothing to complain about at all. You have a good shot at hearing any of these songs on the radio except evermore and four sticks which is crazy. Black dog and rock and roll are obviously 70s rock gold standards, but I skip to the 5:55 mark in stairway basically every time cause it's been overplayed to death and I only need to hear the song transform at the guitar solo into one of the bands best moments. Four sticks is great cause it's carried by the drum/guitar interplay that they do a lot of on Presence which is why I like that record. going to California is a cool song that sounds like it would be at home on II. When the levee breaks is a crazy song that doesn't sound like it would be at home anywhere. I prefer in my time of dying in terms of swampy psychy rock renditions of delta blues standards but this is about as good a song as you can get really. my favorite song on the record though is still misty mountain hop because of how insane everything in the song sounds and it still works perfectly, also the vocals are crazy (all over the record really.) peak record but still not in my top 3 zeppelin records"}, "mason": {"score": 9.0, "notes": "Track by track.  Black dog: super well put together track. The drums go absolutely crazy it’s such a jam (10). Rock and Roll: it’s a rip off of little richard but it’s still a banger (10). The battle of evermoar: It’s a little cringe but good musicality (8.5). Starwey a heaven: overplayed but still a banger if we’re being honest (9.5). Misty Mountain hop: one of the best on the album + banger alert (9.5). Four sticks: undoubtedly the worst on the record. Still pretty good (8). Going to californie: very good but not really a standout (9). When the levee breaks: They ripped of the beastie boys but it’s still a banger album (10)."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/5c/15/9b/5c159b27-95ca-b9a7-84e3-28e795fffd39/dj.kvkrpptq.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as one of rock's defining albums, praised for its stylistic range and the epic centerpiece 'Stairway to Heaven.'"}, {"rsRank": 68, "artist": "Michael Jackson", "album": "Off the Wall", "year": 1979, "genre": "Pop", "own": true, "will": {"score": 8.75, "notes": "great funky disco record. the first side is very peak and the second side gets dragged down a touch by the balladry. the first 5 tracks all have tons of countermelodies going at once with two guitars, bass, piano, and horns all doing interesting stuff that suits the song and highlights his vocals. record starts to slip with the McCartney cover of a deep cut london town track, which was originally written for him but i still think mccartney did it better. it then totally nosedives with shes out of my life, which im sure is great to many people but i dont ever need to hear this sappy broadway ballad really. after that it works its way back up until its in peak territory with burn this disco out. the disco songs sound like heatwave songs cause the dude from heatwave wrote a few songs and helped produce the record so thats cool."}, "mason": {"score": 7.0, "notes": "Very disco album n, praised for distilling Sly and the Family Stone's genre-defining funk and soul hits."}, {"rsRank": 60, "artist": "Captain Beefheart & His Magic Band", "album": "Trout Mask Replica", "year": 1969, "genre": "Prog", "own": true, "will": {"score": 1.0, "notes": "genuinely every music critic HAS to be playing an elaborate prank on specifically me because HOW is this getting 10/10s and ranking so universally highly???? It honestly baffles me and this is for sure the most confusing placement on the list yet for me. absolute noiseslop of a record that just sounds like nothing. I was expecting it to at least be interesting but it fails to even do that, save for maybe three songs. totally dumbfounded by the reception to this record because there's been crappy experimental records on this list that are much better still, even taking into account the credit this gets for influencing them (public image ltd, suicide, Gang of Four type stuff). Those are all in the 400s and I would easily call this the worst of them all if this was among them and call it undeserving of a place on this list, so the fact that it lands in the top 60 is just crazy. absolutely atrocious production makes most of the songs painful to listen to, and the rest just totally lack any sort of quality that makes music enjoyable to listen to. I know that's the point, but like if you make your music crappy on purpose I'm going to call it crappy."}, "mason": {"score": 3.0, "notes": "is bro even serious? this record doesn't deserve a review"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Features125/v4/3e/aa/59/3eaa5989-cc54-abed-b6b3-56956353834a/dj.eypesrwn.jpg/600x600bb.jpg", "consensus": "A famously challenging avant-garde double album, widely regarded by critics as a landmark of experimental rock despite its abrasive sound."}, {"rsRank": 59, "artist": "Creedence Clearwater Revival", "album": "Cosmo's Factory", "year": 1970, "genre": "Rock", "own": true, "will": {"score": 9.5, "notes": "not much to criticize here, near perfect quintessential rock album. the rock and roll covers are the only things preventing this from 10 status, even though I do like them they're just not on the level of the rest of the tracks (those covers being ooby dooby, my baby left me, and bo diddley's Before you accuse me. Not including heard it thru the grapevine because they actually do something new and interesting with it that elevates it far beyond just another rock and roll cover.) the other songs are all 10/10 classics it's really insane how many are stacked on this one album. Ramble tamble is a fast country rocker that turns into a full psychedelic breakdown and goes back again, totally wild song. Travelin band is an awesome 12 bar about life on the road. Lookin out my back door is a super interesting song that stays interesting through the riff, weird lyrics, tempo change, fake ending, and key change. Run through the jungle is a really cool swamp rock song with a great vibe, and go around the bend is just a classic riff propelled Creedence banger. Who'll stop the rain and long as I can see the light are the soulful songs, not ballads but as close as Creedence ever gets. the chord progression in long as I can see the light is endlessly satisfying with the drums. and lastly their version heard it through the grapevine is a totally great blues jam riff off a Motown song that hearkens back to Suzie q on the first album. No misses here, kind of album you love to see in the top 50 or so."}, "mason": {"score": 7.5, "notes": "All songs are pretty good but It's not their best work. Willy and his poor dudes are far better musicians than these fellers but what is on this record still isn't bad. Best songs are the backdoor one, the jungle one, the bend one, the rain one (who will stop the), and ooby dooby"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/f3/81/ca/f381ca2b-0779-4102-2c64-8b2563eedb96/00888072355996.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Creedence record, praised for its hit-packed roots-rock songwriting and John Fogerty's tight, economical craft."}, {"rsRank": 58, "artist": "The Rolling Stones", "album": "Beggars Banquet", "year": 1968, "genre": "Rock", "own": false, "will": {"score": 9.25, "notes": "got into this album during the first month of college just walking around college in the fall and that's probably the best way to hear it. not really another stones record that sounds like this one. musically adventurous while also being home spun and folksy and with the 60s countercultural vibe. really a unique album and the vibe and production is weirdly comforting cause of how homespun it sounds. Sympathy for the devil is obviously a classic rock radio classic so that's a banger. No expectations is a way underrated blues gem with awesome slide guitar. Dear Doctor is a goofy novelty sort of folksy song with fun lyrics and voices. Parachute woman and factory girl are two deep cuts with weird instrumentation and structure that are strangely captivating. Jigsaw puzzle comes off as a Dylan imitation where they're trying to work on their lyricism. Street fighting man and stray cat blues are the hard rockers of the album, cool sitar work in the former and creeper rock lyrics in the latter. Prodigal son is a cool acoustic blues song and salt of the earth is a weird torch song to the common man that closes the record with a Keith co-lead vocal. I love the atmosphere on this record and it obviously sounds far removed from their harder rocking 70s stuff but it's a really great bluesier folkier record that should not go overlooked"}, "mason": {"score": 7.5, "notes": "This shouldn't be higher than sticky finger. This album has some incredible production quality especially for 1968 and some solid quality all around. It's a lot different than other stones records but in a good way. what brings this down is factory girl and salt of earth. those are MID.  best tracks are devil,street fighting, and no exceptions"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/a3/d1/78/a3d178a8-f1c2-c1c3-1c5d-d78ab3af9768/20UMGIM13726.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Rolling Stones record, praised for its return to raw blues-rock and 'Sympathy for the Devil.'"}, {"rsRank": 57, "artist": "Stevie Wonder", "album": "Songs in the Key of Life", "year": 1976, "genre": "R&B", "own": true, "will": {"score": 10.0, "notes": "quite peak. cannot believe the quality of the songs on the bonus ep they should totally be on the record. hard to believe that none of these songs feel too long, even though probably most are over 5m. It always stays interesting through Stevie's obvious exuberance in making music. He is goated at funk (contusion, I wish, ordinary pain), soul (as, pastime paradise, loves in need of love), and even his ballads are great (knocks me off my feet, joy inside my tears). I'm also kinda biased towards double albums because the sheer wealth of bangers that you can fit on these things overwhelm the possible offerings of a single album sometimes. I think this is not just a me thing cause when a big act drops a double album it often is regarded as their magnum opus (Stevie, stones, Elton John, dylan, clash, off the top of my head.) anyway this is just me saying that it has to get above a 9 because the absolute amount of bangers on it make it easier to ignore the weaker tracks which are helpfully located on the last side. Most songs have extremely strong melodies and instrumentation, especially the awesome synthkey sound that I've never heard anyone other than Stevie achieve, and ofc his recognizable yaps and yelps off mic during a jam at the end of a song which are always super fun to hear cause the fun he's having is infectious. With a lot of artists, you end up wishing songs were longer but this is not the case with Stevie in a good way. He writes a lot of 3m songs that just turn into vamps after that where the structure doesn't change and he just does his thing. For example, on joy inside my tears he hits the signature showstopper ballad high note where the instruments drop out at around 3 minutes, and the song isn't even half over. Other times, the song will just totally morph into a different thing to play us out on, like ordinary pain. It's a cool songwriting thing I don't see a ton of other people doing, only stuff like Can't You Hear Me Knocking where it's a fully fleshed out 3m song that gets jammed on for another 3-4m after the song ends, though that was unintentional whereas Stevie lives for the vamping."}, "mason": {"score": 10.0, "notes": "best album of all time simple as that"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music118/v4/eb/1f/12/eb1f12ec-474c-63aa-43af-09282f423b9d/00602537004737.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a Stevie Wonder masterpiece, praised for its sprawling ambition and songs like 'Sir Duke' and 'Isn't She Lovely.'"}, {"rsRank": 56, "artist": "Elvis Presley", "album": "Elvis Presley", "year": 1956, "genre": "Rock", "own": false, "will": {"score": 6.25, "notes": "half solid rockabilly bangers and half lame ballads. For one of the first true rock and roll albums there's a fair amount of not-rock-and-roll. Still so many of these are total classics that I know well before ever listening to the album cause of the huge influence this had on the entire industry of music as we know it. Blue suede shoes, I got a woman, just because, tutti frutti, blue moon are all rightful classics but could give or take the rest. At least it doesn't overstay its welcome like so so many albums on the list from the late 80s onward"}, "mason": {"score": 4.0, "notes": "his version of blue suede shoes is by far the best thing on this album. everything else ranges from early pop rock quality to tolerable blues rock effort. overall not terrible but underwelming. Very influential i guess but I award no pity points"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v teresting stuff happening on the whole record which is all you need coupled with the incredible singing."}, "mason": {"score": 4.0, "notes": "more MID simon and garfunkel. singing isn't even all that good for how boring the instrumentation is. the best song is baby driver which is actually a banger and a half but all of the others are mid and a half. the title track which is supposed to be some commie propagnda is othing but that and cecilia is cringe"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/a3/84/0a/a3840a6d-44e8-0afe-fc3e-316c517dddfe/5099749521421.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Simon & Garfunkel farewell, praised for its soaring title track and polished, emotionally resonant folk-pop."}, {"rsRank": 50, "artist": "Little Richard", "album": "Here’s Little Richard", "year": 1957, "genre": "Rock", "own": false, "will": {"score": 7.0, "notes": "blueprint for rock and roll. tutti frutti, ready teddy, long tall sally, slippin and slidin, rip it up, and miss ann are all rock standards and you can hear so many other artists in his music because of how wide his influence was. for example, the trademark beatles \"ooh\"s from she loves you and other early songs are so little richard inspired, you can hear them in the song jenny jenny. some songs that arent as good here but while the energy is high its peak"}, "mason": {"score": 7.5, "notes": "Suprisingly incredible record. this just shows how much better early black rock and roll was than white rock and roll. particular favorites are tutti frutti which is a great gatsby reference, long tall sally, ready teddy, peepin and hidin, and rip it up"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music128/v4/6a/59/ba/6a59ba83-b62c-0aba-afdf-70112572352d/00888072025745.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed rock and roll debut compilation, praised for Little Richard's explosive vocals and foundational, piano-pounding energy."}, {"rsRank": 49, "artist": "The Allm e dysfunction . title track and live in el fast lane aren't bad"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/88/16/2c/88162c3d-46db-8321-61f3-3a47404cfe76/075596050920.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Eagles record, praised for its polished country-rock songwriting and the title track, though some critics find it slick."}, {"rsRank": 36, "artist": "Carole King", "album": "Tapestry", "year": 1971, "genre": "Pop", "own": true, "will": {"score": 8.5, "notes": "homespun warm california singer songwriter stuff from one of the most successful songwriters ever. songs are all brilliantly constructed and the intimate production makes it a cool atmosphere. I feel the earth move, so far away, it's too late, smackwater jack, natural woman, you've got a friend, will you love me tomorrow are all fantastic."}, "mason": {"score": 7.5, "notes": "This is just some really well produced, really well played, and very well written singer songwriter rock. The best songs are I feel the earth move and It's too late. This is one of those rare instances where the title tract is the worst on the record. most of the other songs on this recors are also good"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/68/b6/0e/68b60e89-9d41-e8a1-bba2-05c750f0832b/dj.hwpyamqm.jpg/600x600bb.jpg", "consensus": "Widely acclaimed singer-songwriter landmark, praised for its warm, intimate songwriting and hits like 'You've Got a Friend' and 'It's Too Late.'"}, {"rsRank": 35, "artist": "David Bowie", "album": "The Rise and Fall of Ziggy Stardust and the Spiders From Mars", "year": 1972, "genre": "Rock", "own": false, "will": {"score": 8.5, "notes": "cool glam record. Idk if I'd call it a full concept album cause there's definitely a fair few songs that have nothing to do with the plot that he just threw on just because, but it's definitely more of a concept album than say sgt pepper. suffragette city is totally peak. Five years, starman, it ain't easy, hang on to yourself are also fire. always interesting to listen to even if some songs are kinda meh"}, "mason": {"score": 8.5, "notes": "This is quite the ambitious concept album for being so short and it certainly doesn't disappoint. some of Bowie's biggest songs like Starman and Suffragette City are on here. This ends up being the best bowie album of all time and probably the only one i would go out of my way to listen to"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/5f/fa/56/5ffa56c2-ea1f-7a17-6bad-192ff9b6476d/825646124206.jpg/600x600bb.jpg", "consensus": "Widely acclaimed glam-rock landmark, praised for Bowie's theatrical persona and songs like 'Starman' and 'Rock 'n' Roll Suicide.'"}, {"rsRank": 34, "artist": "The Band", "album": "Music From Big Pink", "year": 1968, "genre": "Rock", "own": false, "will": {"score": 5.0, "notes": "now idk why this is above all that. the weight is great but the rest is just middling roots rock that's not even as good as the brown album. the songs are okay but really just not anything incredibly interesting like top 34 album of all time interesting."}, "mason": {"score": 4.5, "notes": "It's just so mid. It doesn't really offer much other than the weight and this wheel's on fire. It's not even better than the brown album so why is it even here?"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/44/eb/9f/44eb9ffc-8e77-9a3d-8be7-8ca579de93cc/13UACIM30926.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed debut, praised for its rustic Americana sound and songs like 'The Weight' that influenced generations of roots musicians."}, {"rsRank": 33, "artist": "Ramones", "album": "Ramones", "year": 1976, "genre": "Punk", "own": false, "will": {"score": 6.25, "notes": "the sex pistols record was the definitive punk record in terms of capturing the vibe of what punk is about but this is a much goofier and a bit more commercial version that retains the musical essence of punk. I am not a huge punk fan and some of these songs honestly just have the same exact chord progression since I guess my guy only knows four power chords. it's kind of impressive to be repetitive with a sub 30 minute runtime but they manage. energy mostly saves the record though. blitzkrieg bop, Judy is a punk, I wanna be your boyfriend, I don't wanna walk around with you, now I wanna sniff some glue are the best"}, "mason": {"score": 5.0, "notes": "I expected more from this. It's pretty much just copy/paste punk. nearly every song sounds the same. the big hit off the record was really good but that's about it"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music/v4/eb/c0/ab/ebc0ab80-e4df-08fd-64fd-e3c464e6c607/603497909629.jpg/600x600bb.jpg", "consensus": "Widely acclaimed punk debut, praised for distilling rock and roll to its fast, catchy essentials and igniting the genre."}, {"rsRank": 32, "artist": "The Rolling Stones", "album": "Let It Bleed", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "absolutely peak country rock record. this is a 10 sometimes depending on my mood. nothing anywhere close to a miss. gimme shelter is one of the best songs of all time in its atmosphere and vocals especially. love in vain is a great bluesy slide showcase. country honk and live with me are fun rock songs with great fiddle/horn parts. title track has a great chord progression and singalong chorus. midnight rambler is probably my favorite to listen to on the record cause of how cool the breakdown and vocals and harmonica and choppy guitar are. you got the silver is one of Keith's best songs though probably the weakest on the record if i had to pick one. Monkey man is absolutely a fire song idk why those are the lyrics but the groove is insanely good. YCAGWYW is a classic with one of the most recognizable choruses of the era, though they totally ripped the choir idea from hey Jude (mick jagger admitted as such) and the choir singing those lyrics sounds a bit silly when you think about it. very peak overall"}, "mason": {"score": 9.5, "notes": "I won't even name my favorite songs from this album because they are all bangers. Monkey man is the best though. This is almost exclusively influenced all types of American music dispite it being a British record. Gimmie Shelter sounds like a gospel influenced rock song in a similare vain that would be done later in the Prog Soul movement. Love in vain is literally a cover of robert johnson, another staple of american music influences. Country honk and midnight rambler take clear insparation from country and western music. Monkey man takes heavy American psychedelic influence. The album ends as it starts- with more gospel influenced rock. This album is a perfect repersentatin of american music from a British prespective"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/69/64/67/696467fe-9ed1-b65e-1016-a10d07e6464d/20UMGIM14087.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Rolling Stones record, praised for its dark, apocalyptic mood and 'Gimme Shelter.'"}, {"rsRank": 31, "artist": "Bob Dylan", "album": "Bringing It All Back Home", "year": 1965, "genre": "Folk", "own": true, "will": {"score": 9.0, "notes": "revolutionary record that is up there with the sex pistols and NWA in terms of records that made the most people mad at once. dylan went from the voice of a generation to an absolute traitor to everything his followers stood for, and this record is a tangible representation of that iconic \"going electric\" controversy with the first half being electric and second half being acoustic. the acoustic songs are among his best with psychedelic and caustic lyrics while the electric ones range from protesting (subterranean homesick blues, Maggie's farm) to surreal (115th dream, love minus zero). No misses really as both sides are equally great to listen to though I probably prefer the electric side because of how peak his band was on that side. The groove they always launch into with the guitar flourishes and thundering drums and gritty bass is fire."}, "mason": {"score": 7.5, "notes": "The first bob dylan album I actually like. The lyrical concepts on here aren't nearly as expansive as they would be on later works but it's still very impressive and blows everything else from the time out of the water. take for example Subterranean Homesick Blues. It's about how the world has gone to crap due to people being big ol meanies. compare that to A Love Supreme. That whole thing is just A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme A Love Supreme. I only really like the electric songs and mr. tambourine man. the last 3 songs could have been left off."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/61/ad/46/61ad469e-1e2d-da3c-6847-b939c07924f9/074640912825.jpg/600x600bb.jpg", "consensus": "Widely acclaimed folk-rock landmark, praised for Dylan's electric turn on one side and acoustic poetry on the other."}, {"rsRank": 30, "artist": "Joni Mitchell", "album": "Blue", "year": 1971, "genre": "Folk", "own": false, "will": {"score": 6.5, "notes": "fine album but I prefer tapestry when it comes to homespun female singer songwriter folk rock heartfelt intimately produced records from 1971. Lyrics keep it interesting throughout and they are quite good. California and this flight tonight are the best ones"}, "mason": {"score": 6.5, "notes": "Some good songs like californie with very good vocals in a way that was far better than her other album on here"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/00/a2/43/00a24363-cf69-bfd2-a26a-a042d57ab141/075992719926.jpg/600x600bb.jpg", "consensus": "Widely acclaimed singer-songwriter landmark, praised for Joni Mitchell's raw, confessional songwriting and vocal range."}, {"rsRank": 29, "artist": "Led Zeppelin", "album": "Led Zeppelin (I)", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 10.0, "notes": "gets a 10 cause I genuinely cannot find a moment on this record that's anything short of absolutely peak. it's flawless in its flaws, which are audible throughout and just enhance the vibe of the record as a dirty blues rock album. Every song is fantastic and perfectly sequenced in the album with no misses anywhere. and that's all I have to say about that."}, "mason": {"score": 8.5, "notes": "It's all very good. There aren't any misses. Highlights are GTBT, Babe I'm gonna leave you, Dazed & confussled, Comms breakdown. This is some of the  best executed blues rock ever recorded. gotta be far better than any of clapton's stuff"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/1a/3d/bb/1a3dbb86-c1f8-737e-571f-d6b647a230be/dj.rhubuvkd.jpg/600x600bb.jpg", "consensus": "Widely acclaimed heavy-blues debut, praised for its thunderous riffs and role in shaping hard rock and heavy metal."}, {"rsRank": 28, "artist": "The Who", "album": "Who’s Next", "year": 1971, "genre": "Rock", "own": true, "will": {"score": 9.75, "notes": "peak again. very different album than the last but they still have \"no misses\" in common. I've heard every song to death since they're all incredible so my current favorites are love ain't for keeping, going mobile, getting in tune. one album have baba oriley, behind blue eyes, and won't get fooled again is insane. all timer songs with awesome synth"}, "mason": {"score": 9.5, "notes": "It's all bangers, really. Every song on here is an absolute banger classic. any one of them could be my favorite depending on the day except BBE and getting in tune.There isn't really anything bad to say about this record except those 2 songs aren't 10s"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/a5/e7/70/a5e7703c-4e30-da7a-a319-2d3caef42c0e/23UM1IM04872.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Who record, praised for its synthesizer-driven epics like 'Baba O'Riley' and 'Won't
