e, frequently cited among the best albums of its decade for its scope and ambition."}, {"rsRank": 352, "artist": "Dire Straits", "album": "Brothers in Arms", "year": 1985, "genre": "Rock", "own": false, "will": {"score": 6.25, "notes": "well produced album but it is definitely propelled by the singles, the middle of the album kind of drags what with the 8m spacey jams and all"}, "mason": {"score": 6.0, "notes": "This album is no more than a couple good hits and then a sea of mostly boring 8m long rock instrumentals"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/e8/bd/54/e8bd54fd-6595-4ebf-aa4c-58139ed316e6/dj.bngafruf.jpg/600x600bb.jpg", "consensus": "A massive commercial success; critics generally praised its polish and musicianship while some found its '80s production dated in retrospect."}, {"rsRank": 351, "artist": "Neil Young & Crazy Horse", "album": "Rust Never Sleeps", "year": 1979, "genre": "Rock", "own": true, "will": {"score": 9.5, "notes": "reminds me of bringing it all back home the way the first half is acoustic and second half is electric, although its like a weird grunge folk thing. best songs are powderfinger and the opening/closing track. 9/27 update 6 --> 8.75 --> 9.5 holy peak every song is masterful"}, "mason": {"score": 5.5, "notes": "This record is quite good. Most songs are good. my favorite are the first and last tracks.. This is pretty much a generic rock record but it's done well. not all the songs are bangers however. Ride my llama and welfare mothers are mid asf"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music1/v4/9a/65/18/9a6518c2-850f-f40a-5bad-540a9ef4ad70/093624924708.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a defiant, punk-inflected statement from Young, praised for its raw performances and confrontation with rock stardom."}, {"rsRank": 350, "artist": "The Yardbirds", "album": "Yardbirds", "year": 1966, "genre": "Rock", "own": false, "will": {"score": 5.0, "notes": "a bit better than the other yardbirds one but theres so much more interesting 60s british rock happening at the time of this record and the songwriting is too uninspired. jeff's boogie is the best track"}, "mason": {"score": 5.0, "notes": "There is a significant jump in audio quality and production but this album also is less consistant and has worse songwriting. The first 2 songs are great and not much else."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music/v4/33/ac/cb/33accbe4-2921-4312-84b7-089213ae0c51/5099968455859_1800x1800_300dpi.jpg/600x600bb.jpg", "consensus": "Widely regarded as the Yardbirds' most inventive record, praised for its experimental guitar work from Jeff Beck and psychedelic-leaning ambition."}, {"rsRank": 349, "artist": "Jay‐Z", "album": "The Black Album", "year": 2003, "genre": "Hip Hop", "own": false, "will": {"score": 4.0, "notes": "only thing thats less my thing than 90s rap is 2000s rap. 99 problems is okay and moment of clarity i guess but yeah i just am not a fan"}, "mason": {"score": 8.5, "notes": "This may be the best produced Hip Hop album of all time. There are no bad songs but the worst one is Justify My Thug. Highlights are Dirt Off Your Sholder, 99 Problems, and my personal favorite, Public Service Announcement. This album has no boring ballad or stupid love song which is a problem with other Jay Z albums. The production on this album was changed wvery song with all of the biggest producers at the time: Just Blaze, Kanye West, the Neptunes, Eminem, DJ Quik, Timbaland, 9th Wonder, Rick Rubin, and Pharrell. The lyrics in the album are mostly about his impoverished roots and how this is his last album (he lied about that one). overall solid project"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music118/v4/37/52/4a/37524afd-9ebf-2ff7-086c-845bd199aaa6/00602498611197.rgb.jpg/600x600bb.jpg", "consensus": "Well-received as a mature, largely self-produced Jay-Z record, praised for its lyrical introspection even if seen as lesser than 'The Blueprint.'"}, {"rsRank": 348, "artist": "Muddy Waters", "album": "Muddy Waters at Newport 1960", "year": 1960, "genre": "Blues", "own": false, "will": {"score": 7.75, "notes": "totally fire blues record that was extremely influential on anyone that made good music afterwards. classics include got my mojo working, hoochie coochie man, baby please dont go. energy is goated"}, "mason": {"score": 7.0, "notes": "Pretty decent live blues album. Not much to say about it really."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/09/21/f8/0921f8e1-4284-e0df-09dd-49ccfff3e801/14UMGIM55918.rgb.jpg/600x600bb.jpg", "consensus": "A celebrated live document of Muddy Waters' commanding stage presence, valued as a key snapshot of Chicago blues reaching new audiences."}, {"rsRank": 347, "artist": "Pink Floyd", "album": "Piper at the Gates of Dawn", "year": 1967, "genre": "Psychedelic", "own": false, "will": {"score": 3.0, "notes": "its bad but at least most of the time its funny bad. \"i know a mouse, and he hasn't got a house\ni don't know why I call him gerald, he's getting rather old, but he's a good mouse.\""}, "mason": {"score": 2.5, "notes": "NOTHING LIKE LATER PINK FLOYD. They sound closer to 60s british prog rock. They also experimented heavily with stereo which doesn't always work. It's very experimental and psychodelic sounding and not in a good way. The lyrics are not good. This is borderline unlistenable."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/e7/b4/d3/e7b4d3e0-66d5-0cea-4054-47f3e8bae778/886445635799.jpg/600x600bb.jpg", "consensus": "Widely regarded as a psychedelic landmark, praised for Syd Barrett's whimsical, otherworldly songwriting and the band's spacey experimentation."}, {"rsRank": 346, "artist": "De La Soul", "album": "3 Feet High and Rising", "year": 1989, "genre": "Hip Hop", "own": false, "will": {"score": 7.0, "notes": "consistently interesting and weird artsy hip hop record. feels like the whole thing is a joke and not super serious and like theres tons of inside jokes. the premise of a quiz show is awesome because quiz shows are awesome even though it seems totally random in the context of the album. good samples and quirky subject matters (dandruff?) best songs are eye know, tread water, me myself and i"}, "mason": {"score": 8.0, "notes": "I remember camping this album's spotify page for when it was released on spotify about 2 years ago. Those were the good old days. Anyways, you can just tell they had a ton of fun making this record. This is a fairly long album with a ton of songs but that doesn't matter because they're good. The best thing about this record is how incredible the production of this record is; If Paul's Boutique was the Sargent Peppers of Hip Hop then this album is the White Album. This was the second record released under the Native Tongues collective (A Tribe Called Quest, De La Soul, Jungle Brothers, Queen Latifah, Black Sheep, ETC) and the best in my opinion except for A Tribe Called Quest's 2nd and 3rd albums but those sound closer to jazz rap anyway. Anyways, the best songs are The Magic Number, Jenifa Taught Me, Eye Know, and Buddy. Buddy is interesting because it's the first appearance of Q-Tip and on the remix version Phife appears making it the only song with all of the main 3 Native Tongues groups on it. Also the name for A Tribe Called Quest came from this song because they were originally just called Quest but he called himself from a tribe called Quest because he was using tribe as a term for group but he liked the way a tribe called quest better than quest. There aren't any bad songs really. This album is interesting and exciting the whole time. The samples on this album are also all over the place including Hall and Oates, Steely Dan, Otis Redding, War, Parliament, Johnny Cash, Ohio Players, The Commodores, Bo Diddly, Michael Jackson, Wilson Pickett, Billy Joel, The Isley Brothers, The Steve Miller Band, Pointer Sisters, Average White Band, and Sly and the Family Stone. The album has a total of over 60 samples or about 40 less than Paul’s Boutique. Some of the transitions I could have done without, though… (De La Orgee was NOT NEEDED OR APPRECIATED)"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/17/43/a2/1743a2ab-0630-6527-cca5-a73d855df4a1/810098505963.png/600x600bb.jpg", "consensus": "Overwhelmingly acclaimed as a hip-hop landmark, praised for its playful, sample-heavy production and role in pioneering alternative rap."}, {"rsRank": 345, "artist": "Talking Heads", "album": "Stop Making Sense", "year": 1984, "genre": "Indie", "own": false, "will": {"score": 7.5, "notes": "probably the best that postpunk gets. lots of bangers on here including psycho killer, found a job, burning down the house, life during wartime, this must be the place, once in a lifetime, girlfriend is better, and take me to the river. goofy quirky instrumentation but insane grooves at times. theres a fair number of duds (swamp, what a day that was) but theres too many good songs to weigh them down overall."}, "mason": {"score": 2.5, "notes": "Ignoring the visual aspect of this album, the actual music is cheeks"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/57/94/37/57943788-4a20-07db-1ed9-1fd526a7d0f4/mzi.wfxekfgc.jpg/600x600bb.jpg", "consensus": "Widely hailed as one of the greatest live albums ever, praised for the Talking Heads' inventive staging and Jonathan Demme's direction of the film."}, {"rsRank": 344, "artist": "Lou Reed", "album": "Berlin", "year": 1973, "genre": "Rock", "own": false, "will": {"score": 4.75, "notes": "only captivating cuts really are caroline says and how do you think it feels. most songs are too bland/dull or have production choices that i dont agree with, cause i think these are practically all great songs just not realized. for example, the demo of sad song on the deluxe Loaded is leagues better than this album version"}, "mason": {"score": 4.0, "notes": "Mostly mid with a couple of good album cuts. I get that the whole thing is like a story concept album but the story isn't very captivating and it left me wanting some Meat Loaf"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music3/v4/ab/47/93/ab47936e-b96b-cd80-dd4e-9e30626e72c5/dj.pembshjg.jpg/600x600bb.jpg", "consensus": "A polarizing but eventually reassessed Lou Reed record, initially panned as bleak, later celebrated as a bold, harrowing concept album."}, {"rsRank": 343, "artist": "Meat Loaf", "album": "Bat Out of Hell", "year": 1977, "genre": "Rock", "own": false, "will": {"score": 7.5, "notes": "banging energetic operatic rock. funny lyrics too and incredible instrumentation all around. best songs are the title track, 2/3 aint bad, paradise by the dashboard light. heaven can wait is mid and for crying out loud has no reason to be that long, but the rest of the album tracks are pretty good."}, "mason": {"score": 7.0, "notes": "Very very good rock opera / pop rock album. The production is overdone but it still sounds good. The vocals and piano are incredible. Lyrics are great. Overall songwriting is next level. Some of the cuts especially in the middle aren't incredible but I wouldn't say any of them are bad songs."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/cd/90/b5/cd90b5c4-9379-92ae-da01-4b27ea00697b/886443775787.jpg/600x600bb.jpg", "consensus": "A massive commercial phenomenon; critics were divided on its bombast, but its theatrical, operatic rock has endured as a cult and mainstream favorite."}, {"rsRank": 342, "artist": "Depeche Mode", "album": "Violator", "year": 1990, "genre": "Electronic", "own": false, "will": {"score": 1.25, "notes": "i dont ever need to hear an album like this again. i feel bad for johnny cash since he had to listen to this for his cover of personal jesus."}, "mason": {"score": 1.5, "notes": "synthpop slop. not my thing."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/5c/0e/66/5c0e66c0-d383-5641-3ec0-4bdb629c49ad/886445705119.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as Depeche Mode's artistic peak, praised for its dark, seductive synth-pop and the hit 'Enjoy the Silence.'"}, {"rsRank": 341, "artist": "Moby", "album": "Play", "year": 1999, "genre": "Electronic", "own": false, "will": {"score": 4.5, "notes": "middling electropop. the first two tracks are alright but then it descends into ambient type background noise that is most assuredly not my thing unless im like studying or something for it to be background noise"}, "mason": {"score": 6.5, "notes": "This is surprisingly a semi banger. This is decent instrumental hip hop / house / trip hop. Only problem is that some songs can get repetitive. The best parts of this record come from old school samples which work well with the modern beats to create an interesting sound. This is how you do electronica. The song Run On features the same drum sample as Wu Tang Bring Da Ruckus. Some songs can be repetitive or dull but overall there are not many and this album doesn’t drag too badly. Highlights are Porcelain, Honey, Why does my heart feel so bad, Bodyrock, Natural Blues, Run On. *Note that while I did not include the song flower in my review or ranking because it’s a b-side it is a banger and you should listen to it*\\"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/f9/d8/1d/f9d81d16-b567-5e6d-1304-ceb850c3cd3a/5061041450198.jpg/600x600bb.jpg", "consensus": "A critical and commercial breakthrough for electronic music, praised for its warm sample-based production and crossover appeal."}, {"rsRank": 340, "artist": "Black Flag", "album": "Damaged", "year": 1981, "genre": "Punk", "own": false, "will": {"score": 3.25, "notes": "theres better punk than this. sounds basically like husker du in terms of every song sounding identical except theres less variability in song subjects on here. i would prefer there to be instrumentation other than root notes and power chords but thats just me"}, "mason": {"score": 6.5, "notes": "I first listened to this album this week last year. This is just classic early 80s socal hardcore punk. This album along with their previous 3 eps put LA on the punk map and helped establish the genre of hardcore punk along with the Dead Kennedys (who are somehow nowhere on this list). The lyrics here are mostly vaguely political and societal based. They are mostly about alienation from the system. Stuff about how the youth doesn’t fit in with the conservative societal expectations and norms at the time from both middle aged adults and other young people. Punk was a voice for the voiceless in the 1980s, giving a platform for anarchists and anyone fed up with the status quo in general. Because of this, they weren’t able to have good production value for their record. This is usually a negative, but for this particular album and many other hardcore punk records it actually improves the effect they were trying to get across by sounding more rough. This record is constantly exciting, being only 35 minutes but containing 15 songs. There are no gimmicks on this record. It’s just pure instruments and musicianship. Occasionally this record can feel fratty, but that’s not too bad. Highlights are Rise Above, TV Party, and 6 pack. Most of the songs have the same structure but if it ain’t broke don't fix it."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music/50/69/0f/mzi.hohcnjum.tif/600x600bb.jpg", "consensus": "Hailed as a hardcore punk landmark, praised for its raw aggression and Henry Rollins' intensity as frontman."}, {"rsRank": 339, "artist": "Tom Waits", "album": "The Heart of Saturday Night", "year": 1974, "genre": "Folk", "own": false, "will": {"score": 4.75, "notes": "decent jazzy piano rock, not really any standouts and a lot of the songs sound quite samey, still the best Waits album"}, "mason": {"score": 5.0, "notes": "This sounds nothing like the other 2 Waits albums.Whereas the other 2 were piratecore and southern gothic, This is a lot closer to singer songwriter rock with some blues and jazz injected into it. Similar to the randy newman record I think william will like this quite a bit. I also like it quite a bit because while the lyrics are interesting, the instrumentals are also excellent. The upright bass, jazz drums, and horns sound amazing on this record. My favorite tracks are Diamonds on my windshield, Fumblin with the blues and San Diego Serenade. This record also has a lot of boring tracks unfortunately like Semi Suite and Please Call Me. Overall it’s good although I prefer Rain Dogs."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/30/13/eb/3013ebcc-8627-f413-c0a5-4044670f541a/0045778756605.png/600x600bb.jpg", "consensus": "Well-regarded early Waits, praised for its jazzy, boozy late-night atmosphere before his more experimental later period."}, {"rsRank": 338, "artist": "Big Brother & the Holding Company", "album": "Cheap Thrills", "year": 1968, "genre": "Psychedelic", "own": false, "will": {"score": 6.5, "notes": "psychedelic blues. piece of my heart is one of the best psych blues songs of all time so that kinda carries the album for me, ball and chain + summertime + turtle blues are decent too. production quality is kinda poor and inconsistent"}, "mason": {"score": 6.5, "notes": "Big Brother and the Holding Company can really play some instruments and Joplin can really sing so this record is just a product of great talent and it shows in the recording. However, I disagree with the production choices made here. Particularly how it’s made to sound like a live album even though only like 1 song is actually live. This makes it so that there are annoying unrealistic sound effects that distract from the music. Other than that this record has no misses. Highlights are Piece of my heart and Ball And Chain."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/9c/5c/f3/9c5cf3ff-b840-e1be-ee06-4d9220b36901/074646578421.jpg/600x600bb.jpg", "consensus": "Famous chiefly for Janis Joplin's star-making performance of 'Piece of My Heart,' generally seen as a raw if unpolished psychedelic-blues record."}, {"rsRank": 337, "artist": "Jethro Tull", "album": "Aqualung", "year": 1971, "genre": "Prog", "own": true, "will": {"score": 5.0, "notes": "past the title track it kinda falls off hard but the flute solo in my god goes CRAZY"}, "mason": {"score": 5.5, "notes": "This album is just ok. Aqualung and a couple others are some fire prog rock but most of it is just boring acoustic or poorly mixed art rock. The subject matter is mostly about religion which is relatable because I’m a child of God. Their use of flute was very unique and imaginative for a rock record. Highlights are title track, Cross eyed mary, Locomotive beach."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music7/v4/09/a8/a1/09a8a1ba-c977-e1f2-2be4-d6e8b4b040f8/825646111596.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a prog/folk-rock landmark, praised for Ian Anderson's flute and the album's ambitious concept."}, {"rsRank": 336, "artist": "Radiohead", "album": "In Rainbows", "year": 2007, "genre": "Indie", "own": false, "will": {"score": 4.0, "notes": "shut up mason. i reckon this is well produced but it is not my kind of music at all. spacey electronica with good production value is still spacey electronica and i dont really ever need or want to hear it. theres some cool beats in weird fishes/arpeggi and bodysnatchers but yeah no"}, "mason": {"score": 8.5, "notes": "Interesting mix between art rock and electronica. This is supposed to be the 3rd best album of all time by RYM and it does not disappoint too much. The distortion guitar sound is super gnarly and the boomy vocals only are there to compliment it. The bass lines are sparse and add an additional layer of depth to every piece. The songwriting here is next level with most songs not having a regular verse-chorus-verse type structure. I like this because while it makes the tracks less catchy, It constantly keeps them interesting and unique. The production on this album is so incredible that I (a complainer) have 0 complaints about it. It’s all produced dare I say- perfectly. This album can be super spacey at times but it uses that to its advantage and always does something different on the next song. Highlights include Bodysnatchers, Weird Fishes/Arpeggi, Reckoner, Jigsaw. Every song is good and especially Jigsaw that song is immaculate."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/dd/50/c7/dd50c790-99ac-d3d0-5ab8-e3891fb8fd52/634904032463.png/600x600bb.jpg", "consensus": "Widely acclaimed as one of the best albums of its era, praised for its lush, string-laden production and emotional warmth."}, {"rsRank": 335, "artist": "Soundgarden", "album": "Superunknown", "year": 1994, "genre": "Rock", "own": false, "will": {"score": 7.0, "notes": "seminal grunge album. its aight. the big singles are classics and its pretty consistent throughout although with a 70m runtime on a grunge album it tends to sound a bit samey at times but they try to break it up with stuff like Half. never did realize how beatley black hole sun really is"}, "mason": {"score": 8.5, "notes": "Track by track- Let me drown: Peak music really. Crowded and fun (10). My Wave: Catchy groove and peak instruments. No complaints (10). Fell on black days: Heavy hitting track. No complaints! (10). Mailman: It’s ok but a little repetitive. Still a great song (8). SuperUnknown: Great track with sweet grunge vocals. Nice chorus build up (9). Head down: Banger status. Hard hitting vocals and guitars with a good melody (9). Black Hole Son and Spoonman: No explanation needed (10+10). Limo Wreck: Same great Soundgarden style but it’s not as good as the previous songs. The instrumentals just aren’t as energetic or interesting. Still good tho  (7.5). The Day I Tried To Live: Pretty good but nothing special ot too interesting (7.5). Kickstand: Fast and energetic. I like it (8). Fresh Tendrils: Repetitive and boring. The garden could do better (5). 4th of July: Quite the vibe and a well written track but it’s a lil boring (8.5). Half: Too short for what it is but a solid banger nonetheless (8). Just like suicide: Banger and ½ (10). 130.5/15=8.7=~8.5"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/ae/b6/d6/aeb6d672-2004-41eb-ccba-e2964643a2bc/06UMGIM18607.rgb.jpg/600x600bb.jpg", "consensus": "A critical and commercial grunge peak, praised for Chris Cornell's vocal range and the album's heavier, more expansive sound."}, {"rsRank": 334, "artist": "Graham Parker & The Rumour", "album": "Squeezing Out Sparks", "year": 1979, "genre": "Rock", "own": false, "will": {"score": 5.25, "notes": "dimestore elvis costello. songs are okay but like theres no way this is on here and Look Sharp by joe jackson isnt. clearly elvis/joe/graham influenced and were influenced by each other. i feel like joe borrowed the opening line of his song Memphis from the opening line of Nobody Hurts You off this album. anyway the best track is local girls, the lyrics are strong all around but too much new wave genericism in the music."}, "mason": {"score": 5.0, "notes": "Community College rock"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/a6/6e/df/a66edfe4-c901-47b0-71d2-5927920a674b/mzi.qqnavxex.jpg/600x600bb.jpg", "consensus": "A critically beloved pub-rock/new-wave record, praised for Parker's sharp songwriting even as it remained a commercial underdog."}, {"rsRank": 333, "artist": "X", "album": "Wild Gift", "year": 1981, "genre": "Punk", "own": false, "will": {"score": 3.0, "notes": "the Richard and Linda Thompson of punk"}, "mason": {"score": 3.5, "notes": "Uninteresting 80's punk fused with some new wave. not very much my thing at all. I also got jumpscared by the song White Girl because Red Hot Chili Peppers sample it in Good Time Boys"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music128/v4/f9/c7/c8/f9c7c826-153c-9178-4a0a-2be0535153d9/192562799000.jpg/600x600bb.jpg", "consensus": "Well-regarded as a strong sophomore X record, praised for its punk energy and John Doe/Exene Cervenka's vocal interplay."}, {"rsRank": 332, "artist": "Richard & Linda Thompson", "album": "Shoot Out the Lights", "year": 1982, "genre": "Folk", "own": false, "will": {"score": 4.75, "notes": "better than their 74 album, more interesting lyrics I guess due to the nature of their relationship and better melodies, it's aight"}, "mason": {"score": 2.5, "notes": "It's like their last album only 80s"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music3/v4/38/d8/6d/38d86d92-08af-b68a-656f-e2fbc446a1cf/031257130363.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a devastating breakup album, praised for the raw honesty in the Thompsons' final collaboration before their divorce."}, {"rsRank": 331, "artist": "The Beatles", "album": "Help!", "year": 1965, "genre": "Rock", "own": false, "will": {"score": 9.5, "notes": "track by track: help!: 9.9, absolute classic with incredible harmonies and driving beat, the call and response in the verses is great. the night before: 9.5, great song, nice organ part and the dueling guitar solo is fun. youve got to hide your love away: 9.7, convincing dylan impression with funny lyrics. chord progression is endlessly satisfying and the flute solo at the end fits the song nicely. I need you: 9.2, fun little george track with interesting and pioneering use of the volume knob on the guitar, i like that you can hear it being turned up and down. another girl: 9.6, great paul rocker with nice guitar fills. youre going to lose that girl: 10, my favorite on the record, the harmonies, call and response, insane bongo work, and driving guitar make a perfect song here. ticket to ride: 9.6, nice riff, ringo never does the same fill in the verses and keeps it interesting, and the coda at the end is the cherry on top. act naturally: 9.1, ringo gets a mopey song and george's guitar carries it. its only love: 8.8, probably the weakest on the record but only due to the lyrics that are almost comically dumb (\"when you sigh, my my insides just fly. butterflies.\") you like me too much: 9.2, love the dueling guitar/piano solo and the trippy george change for the post chorus. tell me what you see: 9, nice piano and harmonies in one of the deepest cuts in the catalogue. ive just seen a face: 9.6, total classic. endlessly catchy propelling beat and chorus. campfire song to end all campfire songs. yesterday: 9, not much to say about it that hasnt already been said. its the most covered song of all time. dizzy miss lizzy: 9.4, john vocal shredder to end the record, kinda funny that it ends on this rock classic instead of the somber Yesterday. average is a 9.4 > 9.5"}, "mason": {"score": 3.5, "notes": "This is their last album before they were super weird and experimental. It sounds like those earlier albums except with far far better production, writing, and instrumental skill. That’s not to say that it’s good though. Every song here was specifically made to be a pop radio hit. Also the songs are all way too short. This works for some genres but here every song just feels like a catchy hook, a lazily written verse, maybe a bridge or a solo, and then it quickly wraps up into a small radio friendly package. Also would it kill them to make 1 song that’s not about relationships? That's not relatable and it makes them seem out of touch with the audience. Why was this music even revolutionary? There was so much better stuff out at the time like paul butterfield. Sure, “Born in Chicago” also wasn’t relatable but it was just a much better song. Best song is none because they all suck. Worst song is Ticket to Ride just because of the annoying tom fills in the verse. 3.5 points arre awarded for improvement."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/1a/19/db/1a19db26-17ad-b986-11a9-f72ac7a6194b/18UMGIM31214.rgb.jpg/600x600bb.jpg", "consensus": "Generally viewed as a transitional, slightly uneven Beatles record, though praised for the title track and growing songwriting sophistication."}, {"rsRank": 330, "artist": "Neil Young", "album": "Tonight’s the Night", "year": 1975, "genre": "Rock", "own": false, "will": {"score": 9.0, "notes": "neat little folk rock album with cool guitar playing, lyrics, and vocals. highlights are the title track, mellow my mind, borrowed tune. pretty cool that he openly plagiarises Lady Jane by the Stones, openly admits to it in the lyrics, and still doesnt get sued (by the same leech record company run by allan klein that sued the verve for using the orchestral version of The Last Time in Bittersweet Symphony) 9/27 update 6.5 --> 9. record just takes a while to grow on you and is NOT a good intro to neil, i understand it now."}, "mason": {"score": 4.5, "notes": "Most of the album is decent except for a couple boring songs like Borrowed Time. Production is poor, writing is very good, and instrumentation decent. Title track is the best one. There is an ear shattering audio glitch at 2:17 on the track “Come On Baby Let’s Go Downtown” that sucks balls. He also stretches his voice too far in Mellow My Mind which is actively painful to listen to. His voice is a lot rougher on this record than on his other records."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/da/14/7d/da147d46-bd4e-ea55-03eb-ea82e302ab83/093624835097.jpg/600x600bb.jpg", "consensus": "A raw, mournful record recorded in the wake of two deaths in Young's circle; widely praised for its unfiltered emotional honesty."}, {"rsRank": 329, "artist": "James Brown", "album": "In the Jungle Groove", "year": 1986, "genre": "Funk", "own": false, "will": {"score": 8.0, "notes": "funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky funky. wish it had People get up and drive your Funky Soul but i reckon it just missed the cutoff for single releases to be included. still the songs with their 7m+ length don't get boring thanks to mr brown keeping it interesting with his grunts and growls and good gods, and the goated rhythm section."}, "mason": {"score": 8.0, "notes": "One of the smoothest, funkiest compilation of hits ever recorded. This may be the single most sampled record ever. Throughout it I keep hearing sections that I recognise from a Big Daddy Kane song or a BDP song or a RunDMC song or something. Everything here is a masterpiece and a banger. Bonus beat reprise was literally just an attempt by Brown to fish for hip hop sample royalties lol but it was fire and effective. The bass and drums go crazy in the rhythm section, the horns go crazy in the horn section, and, as it sounds be, the guitar is quieter than the bass and is relegated to the left ear in some tracks. Bootsy on bass absolutely went insane and really kept all of the recordings together. The syncopated drum rhythms on nearly every track are the stuff of dreams. This is just juicy, thick, funky goodness. Every song except for the bonus beat are over 6m long and half of those are over 8 but it never feels like it drags because there is always something interesting going on, whether it be Browns vocals which are pretty much just grunts and yells most of the time, or rhythm changes, or any amount of other things in the recording. Anyway, to answer the question Brown feels the need to repeat multiple times at different points in the record; yes, It is funky."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/c9/8c/80/c98c8051-cd34-beb7-7457-178cb3118276/06UMGIM22849.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded James Brown compilation, valued for capturing his rhythmic innovations across a broad cross-section of his catalog."} king the girl is beautifully crafted and may be the best or second best record on the album (10). Funky Monks is a sort-of return to their original style of funk but way more laid back. It’s beautifully mixed as well. Perfection (10). Suck My Kiss is probably my favorite track on the album. It’s a heavily punk inspired song with funk elements and a good breakdown (10). I Could Have Lied took me a while to truly appreciate. The relative slowness of it compared to other tracks around it helps build tension and it’s also lowkey a vibe. It’s got that classic RHCP California sound (10). Mellowship Slinky in B Minor has probably the best bass on the album. Well probably not but it’s awesome nevertheless. The Chorus also just hits different (10). The Righteous and The Wicked is one of the more forgettable tracks but it is by no means bad. The lyrics are nice and the instrumentation is top notch (9.5). Give It Away is a catchy radio hit in the best way possible. The bass is so friggin packet yo while the guitar is quiet and stuck in the right ear (10). The title track is really weird and awesome. I love it (10). Under The Bridge - I think everyone can agree - is an absolutely amazing track (10). Naked in the rain is pretty good but it's a let down from under the bridge (9). Apache Rose Peacock took a while to grow on me but it's now one of my favorite rhcp songs (10). Greeting song is ok but not great (8.5). My lovely man is an incredible masterpiece of music (10). Sir Psycho Sexy is weird and awesome and I love it. Over 8m of nonstop enveloped bass. The lyrics are…. Interesting, this song is just so cool. The extended outro is also awesome (10). They're red hot is a perfect outro. It's just an amazing 1 minute Robert Johnson cover (10). 167/17=9.82~10.         The production throughout this record is absolutely immaculate. The pacing is also perfect with every song where it needs to be while never getting boring. Is this album a little too long? Nah it’s ok. Anyway this is a pretty decent album."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/2b/2b/56/2b2b564c-e21e-bd40-a8cf-cb47dedcb7df/093624932147.jpg/1200x630wp-60.jpg", "consensus": "Widely acclaimed as the Chili Peppers' commercial and artistic breakthrough, praised for its funk-rock fusion and emotional range."}, {"rsRank": 309, "artist": "Creedence Clearwater Revival", "album": "Willy and the Poor Boys", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 8.0, "notes": "this album has obvious flaws like poorboy shuffle and side o' the road but anyway the best songs are down on the corner, cotton fields, feelin blue, fortunate son, and midnight special. even the worst songs on cosmos factory rival the best on this record though... this record doesnt have the experiments that past and future creedence albums have such as psychedelia (keep on chooglin on bayou country, ramble tamble on cosmos factory) or extended jams (suzie q on debut, heard it through the grapevine on cosmos factory), etc."}, "mason": {"score": 8.5, "notes": "fantastic electric blues record. this is like if the eagles weren't unbelivably mid. best song is down on the corner. overall quality is high though."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/29/1b/da/291bda3c-1743-c65c-41a6-f22a88936136/14CMGIM00939.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded Creedence record, praised for its roots-rock songcraft even if overshadowed critically by their more iconic albums."}, {"rsRank": 308, "artist": "Frank Sinatra", "album": "Songs for Swingin’ Lovers!", "year": 1956, "genre": "Jazz", "own": false, "will": {"score": 6.0, "notes": "really not as bad as i thought it was gonna be, great jazzy instrumentation over introspective lyrics delivered with great vocals. Really consistent record too, which is sometimes a flaw in itself cause a lot of songs sound similar. Lyrics to \"anything goes\" are funny cause that was 69 years ago and he's whining about how th ogy 1 would've worked nicely on the final version and I hear em in my head every time anyway. Any time at all (9.7) great call and response from Paul and John, the bridge is cool since there were supposed to be lyrics but the touring schedule was too busy to find time so it's just a nice piano interlude instead. I'll cry instead (9.3) love the bass break in this song, great country rocker yet again. Things we said today (9.2) interesting introspective number from Paul about experiencing nostalgia in the present, among the best lyrics on the album and a feeling I've never heard described anywhere else. When I get home (9.4) nice propelling rock number. \"I'm gonna love her till the cows come home\" is a dumb lyric but it's funny. You can't do that (10) banging riff from George and a great guitar solo from John with the title yelled in the middle of it. One of their best early rockers. I'll be back (9.1) cool ballad John made from shuffling the chords to del Shannon's runaway. It has two bridges, both of which are interesting. well crafted song with major minor switches that work to great effect. Overall idk what this number turns into but the main reason this isn't a 10 is because there are plenty of other beatles albums that are better."}, "mason": {"score": 3.0, "notes": "This is like help but worse. The crappy 60’s use of stereo sound is abysmal, every song is about romantic relationships which annoys me so much because you literally have nothing better to talk about? There is so much a cong could be about like war and mental illness and addiction but noooo you have to make every song sound like “ooooooooooooh and i love you oooooooooooh you love me toooo” like stfu nobody cares. anyway , the instrumentation on this album is garbage compared to literally any electric blues record of the time, the vocals are annoying and mixed way too loud, and ringo is bad. No good songs also."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/db/a2/7a/dba27a46-3 t like im going to listen to this with the same purpose I do pop records. this is like something you listen to either as a musician to take inspiration from or to use as background music for something else"}, "mason": {"score": 9.0, "notes": "This is one of the most innovative jazz albums of all time displaying what could truly be done further with the genre in the 50s, pushing the radical sounds of hard/post bop even further to create a chaotic masterpiece of free jazz. This record was also highly influential in the civil rights movement as free jazz was a genre that was used as a symbol of rebellion and societal norms. The way coleman plays was very controversial at the time, playing without much of a set song structure and in quick bursts rather than being more melodic. The bass and drums on this record are incredible. Highlights are Track 1 and 2 for their incredible rhythm sections. Track 4 is also excellent as well as 5 and 6. I really only think track 3 is not a highlight just because it’s too long and not as interesting although it’s still not bad."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/ec/fe/82/ecfe82b7-b821-b318-17ad-512b9cd1717b/s06.afpdcbhn.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a jazz landmark, praised for Ornette Coleman's pioneering, harmonically free approach that helped define free jazz."}, {"rsRank": 247, "artist": "The Grateful Dead", "album": "Live/Dead", "year": 1969, "genre": "Psychedelic", "own": false, "will": {"score": 3.25, "notes": "never been a big fan of jerry garcia guitar style it just sounds like staccato single notes played up and down a scale over and over again and isn't super interesting to me, and this is just 75 minutes of that except with a 7m long track of just pure guitar feedback. best song is turn on your love light but yeah I wouldn't return to any of these."}, "mason": {"score": 3.5, "notes": "6greatful dead back to being painfully mid. This should be lower than American Beauty ative sexual frankness."}, {"rsRank": 205, "artist": "Cream", "album": "Wheels of Fire", "year": 1968, "genre": "Rock", "own": false, "will": {"score": 5.0, "notes": "studio disc is not super interesting beyond white room, politician, sitting on top of the world. weird experimental psych rock for the most part. the live disc is not really interesting at all and probably should not be part of the real album cause the 16 minute long songs are pretty much just jams that would be fun to see live but totally lose their magic on record. 14 minute drum solo is cool but i dont really need all that"}, "mason": {"score": 5.0, "notes": "white room is fire and hype but nothing else on the studio side is aywhere near to as good. The album drags a bit in the live section but not before it gives us the other good song on the album, Crossroad."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/d8/3b/bd/d83bbd5e-00d8-45d4-71e2-6e337447cea0/26UMGIM12320.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Cream record, praised for its blend of studio and live tracks showcasing the trio's virtuosic improvisation."}, {"rsRank": 204, "artist": "Bob Dylan", "album": "Modern Times", "year": 2006, "genre": "Folk", "own": false, "will": {"score": 6.25, "notes": "less sharp instrumentation and production than love and theft, and theres not as much humor in the lyrics. it continues the trend of pre60s american music though with some blues, rockabilly, balladry. i do not care for the ballads but the blues/rockabilly ones are cool (levees gonna break, rollin and tumblin). the only other great song of note is aint talkin, which is cool and ominous. other than that the songs drag a bit too much to sustain interest all the way through, which is another reason love and theft is miles above this. this record has less fun guitar work and grooves. no idea why this record is on the list, let alone above wish you were here. even in the dylan discography theres so many better records ike it. if i already know a song is a banger and then I hear it being rapped over then I like it basically every time. This is what happens on this album with superfly, those shoes, momma miss america, lorans dance, that lady, tell me something good, and like 3 Beatles songs in the sounds of science. so many samples jammed into every song that i still find new ones about every time I hear it and i also still hear songs in the wild that I've heard sampled on this record. also the concept of bboy bouillabaisse is funny it's like they wanted to do the abbey road medley of hip hop. reckon it makes sense why they call this the sgt peppers of hip hop"}, "mason": {"score": 8.5, "notes": "not as good as last beastie record but still really good. there is a drop off in quality about halfway through which isn't present in licensed to ill. best songs are shake your rump, johnny ryall, egg man, and shadrach. the b boy ones are interesting."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music114/v4/e4/d7/81/e4d781e8-bd3f-486a-cd18-e9b3a7d12b34/00731452735126.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a hip-hop landmark, praised for its dense sampling and the Beastie Boys' creative reinvention after 'Licensed to Ill.'"}, {"rsRank": 155, "artist": "Pretenders", "album": "Pretenders", "year": 1979, "genre": "Rock", "own": false, "will": {"score": 6.25, "notes": "cool enough new wave rock type stuff. I prefer Learning to Crawl but I guess this is here cause it's the debut, not cause it's the best. Best songs are tattooed love boys, brass in pocket, private life"}, "mason": {"score": 6.5, "notes": "It has a couple of good songs like the one about brass and the first one  and it's fairly consistent in quality."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/e0/f4/71/e0f471cb-08f8-d33f-f8f0-b29d2c3db01e/196922554674_Cover.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Pretenders debut, praised for Chrissie Hynde's tough, romantic songwriting and the band's tight musicianship."}, {"rsRank": 154, "artist": "Howlin’ Wolf", "album": "Moanin’ in the Moonlight", "year": 1959, "genre": "Blues", "own": false, "will": {"score": 5.5, "notes": "classic blues. production drags it down quite a bit but thats to be expected with a record like this i reckon. best songs are the first 3.  no duds but no standouts really either"}, "mason": {"score": 5.5, "notes": "better than his last album but it also suffers form being just blues the whole time with not a whole lot interesting being done"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/b2/ed/5e/b2ed5ea1-2bc0-5b3a-8297-7df5ed2d13b8/15UMGIM29010.rgb.jpg/600x600bb.jpg", "consensus": "A well-regarded early Howlin' Wolf compilation, praised for capturing his raw, primal Chicago blues sound."}, {"rsRank": 153, "artist": "A Tribe Called Quest", "album": "The Low End Theory", "year": 1991, "genre": "Hip Hop", "own": false, "will": {"score": 9.25, "notes": "best songs are buggin out, butter, verses from the abstract, show business, what, scenario.. great production and jazz samples and the lyrics are clever and humorous which is what i like in rap i reckon. no duds on the record really theres cool stuff happening in all of the songs. bunch of stuff is mentioned several times in songs like the arsenio hall show for some reason. the hooks are good"}, "mason": {"score": 10.0, "notes": "This album has everything you could possibly want from a rap album- a consistent theme and style throughout; callbacks, call forwards and references everywhere; 2 of the best MCs that have ever done it; incredible unique production with old school jazz samples; consistent song quality; great lyrics; and a good sense of humor. Here’s a track by track rating. Excursions- probably the best song on the album. 2 great verses from Tip with insane production. Also the sample says retarded so that’s based (10). Buggin Out- First appearance of Phife on the record and a good one at that. Both MCs do great here with flow and lyricism as well and production. More double bass [star eyes emoji] (10). Rap Promoter- raw production that stays interesting with changes and whatnot with a good flow by Tip (10). Butter- Phife’s first and one of his 2  solo songs in tribe called quest’s original 3 albums. This was the first tribe song that fully showcased his abilities and he did very well. Low taper fade (10). Verses From The Abstract- Song contains a feature from Ron Carter. He even gets a shoutout by tip! End of discussion. Ok well it also has really good rapping by Tip and whatnot (10). Show Business- First out of 2 rapping features. The interesting thing about both of these features is that they are both whole group features so this song and scenario both have like 5 rappers. Anyway this song has good production, rapping, lyrics, humor, and features. The feature here is from the group Brand Nubian and the best verse probably comes from Lord Jamar. This is like the have a cigar of hip hop or something idk (10). Vibes and Stuff- You know the deal. Great lyrics, production, and rapping. There’s not really anything special about this one compared to any other song on  the album and it’s a bit forgettable. It’s still really good though and it gets extra points for phife because he’s fire (9.5). Infamous Date Rape- Ouch this one didn’t age well. If you take this one with a little bit of skepticism then it’s passable lyrics. Production is top notch though and so is their flow. But wow these lyrics are a little ouch (9). Czech the Rhyme- possibly the best rap song ever. Incredible production with sampling from AWB and great lyrics and back and forth between phife and tip (10). Everything Is Fair- This is incredible. Lyrics and production are of course top notch, breaking up the beat constantly with sound effects and samples and keeping the song interesting (10). Jazz (we’ve got)- Perfect song. Great sample with best production on the album. The Phifer and Tip are both peak here. It’s hard to really describe what makes this song great exactly but it just is (10). Skypager- Worst song on the album primarily because of the chorus not sounding great but the verse makes up for it and then some. The production also isn’t as good on this one. It’s still a good song tho (8.5). What?- We’re back to a perfect song. Tip keeps asking “What’s ____ if/without _____?” to make political statements and shout out his crew  or more often to make a stupid attempt at comedy. It’s still fun (10). Scenario- This features The Leaders of the New School, a hip hop collective that included Busta Rhymes who also had the best verse on here. Production is simplistic but it kinda needs to be for all of these featured rappers. Fun fact- after Busta Rhymes did his verse, it was so good that everybody else re-recorded their verse so Busta Rhymes verse wouldn’t seem out of place (10).  137/14=9.79=~10"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music71/v4/12/b4/0c/12b40cae-c845-1729-a374-cb5f3619d061/886446229980.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a golden-age hip-hop landmark, praised for its jazz-inflected production and lyrical sophistication."}, {"rsRank": 152, "artist": "The B‐52’s", "album": "The B‐52’s", "year": 1979, "genre": "Indie", "own": false, "will": {"score": 4.75, "notes": "goofy post punk new wave ish stuff. like devo but weirder. best songs are rock lobster and hero worship. not really anything boring but just like kind of mid i guess. this record was an inspiration for john lennon to get back to making music though so thats cool"}, "mason": {"score": 4.0, "notes": "rock lobster is good. nothing else comes anywhere close and it just devolves into 80s weirdness. very similar to the devo record in that way"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music125/v4/75/88/d8/7588d898-6ed3-cfef-f3d3-9938a63902d1/603497890422.jpg/600x600bb.jpg", "consensus": "Widely acclaimed new wave debut, praised fo at for the time and still sounds great today compared to the copy and paste production of modern gangster rap albums. The lyrics are brain rotting stupid at time. There’s a lot of political stuff on here like police brutality but then they place just outright misogyny and violence next to it. Like do you want me to feel bad for you or think you’re a tough guy because it can’t be both? Anywho, the highlights are the first 3 songs, Express yourself, and 8ball. The actual rapping ability here is really good, especially from eazy e and ice cube (sorry mc ren). Dr. Dre even makes his rapping debut on the song Express Yourself (and like 2 other tracks) which might be the best song after the first 3. Dr. Dre isn’t that great of a rapper (although it’s nothing atrocious) but he’s great at production and DJ Yella is good on the turntable. Listening to this can seem funny today because what is seen as “gangster” has changed so much throughout the years that it seems crazy that parents were going crazy about this back then. One of the best parts about 80s rap is how many times they reference each other. If you listen to a couple of different 80s artists you will notice they constantly sample each other and themselves, as well as quoting each other and using the same samples. It’s like giving your homies a shout out on record and it’s awesome. This record is no different in that respect. Also, Gangsta Gangsta has a short segment during Eazy's verse that’s proto g funk which is cool. Also legendary callback in dopeman “Done stole the Alpine out of Eazy's '64” is a reference to boyz n tha hood where it says “The boy J.D. was a friend of mine 'Til I caught him in my car tryna steal a Alpine”"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music113/v4/4c/b1/32/4cb13290-7d01-1949-57e9-a8a1874e60a2/19UMGIM79184.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a hip-hop landmark, praised for N.W.A's unflinching depiction of South Central L.A. and its role in birthing all off from his first one. it's way too long for a 50s record and it's all the most lame pop music you could think of"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music122/v4/97/a7/42/97a7424f-8161-052f-ce3c-93730c2d30de/14UMGIM32540.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a landmark concept album, praised for Sinatra's mood-setting song sequencing and Nelson Riddle's arrangements."}, {"rsRank": 100, "artist": "The Zombies", "album": "Odessey and Oracle", "year": 1968, "genre": "Psychedelic", "own": false, "will": {"score": 5.5, "notes": "mid to decent psychedelia. songs are objectively well written with good music and lyrics but they arent super captivating to me really. it picks up a bit near the end. this will be our year and time of the season are the best tracks"}, "mason": {"score": 2.0, "notes": "some of the worst psychadelic rock i have ever heard on my 17 years on this earth. i could have done without this one. nothing is notable and production is poor. parts are unlistenable"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/21/5a/a5/215aa554-bc35-193a-9d80-08247cac571c/810183320198.png/600x600bb.jpg", "consensus": "A commercial flop on release that critics have since reclaimed as a baroque-pop masterpiece, praised for its lush harmonies and orchestral arrangements."}, {"rsRank": 99, "artist": "Sly & the Family Stone", "album": "There’s a Riot Goin’ On", "year": 1971, "genre": "Funk", "own": false, "will": {"score": 6.0, "notes": "i liked the other two sly albums better for some reason, theyve got more captivating grooves. the best cuts on here are the 8 minute jams that mention africa and include elements of thank you falletinme be mice elf. however, There's A Riot Goin' On is probably the second best song of all time, only behind john lennon's Nutopian International Anthem."}, "mason": {"score": 6.5, "notes": "a reference and response to whats going on by marvin gaye, this album slaps pretty hard but it has less good writing than many of their other albums like stand."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/91/01/9f/91019f68-fbc9-5620-d49a-88043d75371e/828767591124.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a dark, murky turn from Sly Stone, praised for its claustrophobic funk and drum-machine textures, though initially divisive."}, {"rsRank": 98, "artist": "Elvis Costello & The Attractions", "album": "This Year’s Model", "year": 1978, "genre": "Rock", "own": true, "will": {"score": 6.5, "notes": "better than armed forces and imperial bedroom, not as good as my aim is true. highlights are no action, pump it up, radio radio. he has a very particular songwriting style with punchy verses and choruses shoved into a 3 minute runtime that nearly always ends with a repeated yelling of the title of the song which is funny sometimes."}, "mason": {"score": 7.0, "notes": "this is just the good elvis costello record"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/3b/40/80/3b40808e-986c-7b03-d337-1c9ee850b45e/21UMGIM48777.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as the peak of Costello's early run, praised for its taut, paranoid new wave energy and biting songwriting."}, {"rsRank": 97, "artist": "Bob Dylan", "album": "The Freewheelin’ Bob Dylan", "year": 1963, "genre": "Folk", "own": true, "will": {"score": 9.0, "notes": "track by track: blowin in the wind: maybe the most famous folk song of all time. endlessly memorable and meaningful lyrics and chord progression to match. girl from the north country: i prefer the fun atmosphere on the johnny cash duet (and notable absence of that one ear splitting harmonica shrill near the end), but this version is great too. masters of war: piercing protest song, one of the first of its kind. before this record, protest songs were typically traditional folk anthems from the dust bowl era about either civil rights or the state of the nation. this inspired thousands of protest songs throughout maybe the most protesty decade in music. \"i hope that you die, and your death will come soon; ill stand over your grave till im sure that youre dead\" in 1963??? down the highway: great blues with a weird guitar riff and great use of space that highlight the lyrics, which are really what this record is all about. its not a dylan record without a 1-4-5 with exclusively verses in AAB. bob dylan's blues: one of 3 \"talking blues\" songs on the record, which is basically just him strumming a guitar and yapping with only a loose idea of what he's gonna say next. he normally is half laughing while delivering lines and takes harmonica breaks often. of the 3, this is probably the weakest. he also does the 60s version of what eminem says often on his records, the satirical \"look here buddy, you wanna be like me, pull out your six shooter and rob every bank you see, tell the judge i said it was all right.\" a hard rains gonna fall: all time fantastic song. the buildup in the verses and chorus are endlessly satisfying and the chord progression is great. lyrics are psychedelic before psychedelia. the type of song that makes you wonder how someone can write a song like this. dont think twice its alright: one of the most bob dylan bob dylan songs ever. listening to it evokes walking in the cold with your jacket hunched up to your neck and your hands in the pockets of your jeans. very expressive breakup song, chock full of great lines like \"you coulda done better but i dont mind, you just kinda wasted my precious time\", and \"goodbye is too good a word babe, so i just say fare thee well\", but not \"i once loved a woman, a child i am told.\" bob dylan's dream: probably my least favorite song on the record just cause it conjures an image i dont like to think about, which is crushing nostalgia and never seeing your childhood friends again. really its just too long for what it is and the low strings on the guitar sound slightly out of tune. oxford town: one of dylans many civil rights protest songs of this era. concerns the ole miss riots over integration that killed two people. a bit timid for a protest song, \"two men dead 'neath the mississippi moon, somebody better investigate soon\" isnt as urgent as some of the civil rights songs on his next record. still a good song. talkin world war 3 blues: fun talking blues. this is probably the best of the 3 on the record cause of how goofy it is. i think abraham lincoln said that! corrina corrina: only song on the record with a band, pretty good song, not super notable. honey just allow me one more chance: silly fun song, in the vein of baby im in the mood for you (shouldve replaced bob dylans dream on the record). hes clearly enjoying himself on this and its infectious. i shall be free: final track, talking blues. \"the funniest girl i ever seen was the great granddaughter of mr clean.\" tons of outdated references that probably made sense at the time but just make it a relic of its era really. overall this record could be seen as the catalyst of the 60s, hugely inspirational and revolutionary for the time. way different than the music that preceded it. yap sesh"}, "mason": {"score": 3.0, "notes": "middling folk with paulfully boring instrumentation and meandering vocals. dylan's voice is just as poor as ever with the added effect of poor production. everyting sounds pretty much the same and not in a good way. the poor harmonica mix grates the ears. bob dylan is important for inspiring people and stuff but his music is cheeks and bad to listen to. he's not locked T.F. in and is just capping."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/63/3c/98/633c98ab-b4f3-3f40-798b-bdb49d923468/074640878626.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as the record where Dylan found his voice as a songwriter, praised for 'Blowin' in the Wind' and 'A Hard Rain's A-Gonna Fall.'"}, {"rsRank": 96, "artist": "The Who", "album": "Tommy", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 7.75, "notes": "one of the most ambitious projects in rock music. dunno if it quite achieved its expectations because for a concept album rock opera it has a spotty narrative in many places. the banging music and thematic elements make up for this mostly though. christmas, fiddle about, pinball wizard, im free, we're not gonna take it are all great songs and theres a lot of cool snippets in other songs that you could probably find a narrative in somewhere. better than quadrophenia  but i might actually take the who sell out over this since i like my music goofy and unserious."}, "mason": {"score": 8.5, "notes": "top tier rock opera. It's interesting to follow a sad story about the abuse of a disabled person throughout his life with amazing musical accompaniment. the soundtrack would have been much higher but this is still very very good. even though so many of the songs are just not good, they serve to tell a greater story. this is more than just an album, it's a comprehensive story. best songs are pinball wizard, im free, christmas, and we're not gonna take it reference"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/f3/22/7f/f3227fd3-758e-2728-7db2-25b29373c8ae/18UMGIM35635.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a landmark rock opera, praised for its ambition and Townshend's songwriting, though some find its story convoluted."}, {"rsRank": 95, "artist": "Miles Davis", "album": "Bitches Brew", "year": 1970, "genre": "Jazz", "own": true, "will": {"score": 8.25, "notes": "definitely some of the jazz of all time. I like the first disc better than the second because of the balance of highs and lows throughout the songs. This would be a great album to have on vinyl I feel like. Miles Davis kind of goated? i dont know how to justify giving this an 8 really or why its enjoyable to listen to it just is. this might be the most confusing record on the list so far. theres so much going on at all times. as i write this im relistening to miles runs the voodoo down and theres a drummer in both my left and right ears frantically banging their drum sets while two keyboards in either ear take totally mashing solos and the bassline stays the exact same the whole time holding the band together. i love how you can hear miles telling the musicians to play quieter or switch the groove up throughout the record."}, "mason": {"score": 8.5, "notes": "this album is just off the walls wild. I would say that it's too avant garde for its own good but then i would be lying. the fusion style of the record makes it have an interesting sound compared to some other types of jazz and allows it to transend many boundries. pharaohs dance is the best song"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music116/v4/9b/e1/63/9be1630c-486d-760c-76cf-04282174700a/074646577424.jpg/600x600bb.jpg", "consensus": "Widely regarded as a fusion landmark, praised for its sprawling, electric experimentation, though some listeners find it dense and challenging."}, {"rsRank": 94, "artist": "Hank Williams", "album": "Hank Williams 100", "year": 1952, "genre": "Country", "own": false, "will": {"score": 2.5, "notes": "i'd like to be done with country now if thats okay with rolling stone. theres a fair few country classics on here which are alright like your cheatin heart, you win again, im so lonesome i could cry, but generally i dont like listening to em for some reason. move it on over is pretty good though. this might as well be merle haggard for all the difference it makes. sometimes i wonder how many albums made this list purely because whoever made it died tragically and this makes them immortalized in a way. hank williams, patsy cline, gram parsons, etc. this might just come from me disliking country though because the same could be said for janis joplin, sam cooke, and buddy holly's inclusion in the list where the only difference is that i actually like them."}, "mason": {"score": 4.0, "no ost of this is just outdated  rockabilly . some of these would be singlehandedly saved without the low production beckup vocals going  \"wop wop do wop do wop shoe bop do wop\""}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music118/v4/70/ee/e8/70eee867-fbec-35fd-d231-a97fcb595020/00602567833178.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed compilation, praised for capturing Buddy Holly's foundational songwriting and influence on rock and roll."}, {"rsRank": 91, "artist": "Elton John", "album": "Goodbye Yellow Brick Road", "year": 1973, "genre": "Rock", "own": true, "will": {"score": 9.25, "notes": "track by track: FFAF/LLB: lowkey proggy start to the record, couldn't really have fit anywhere else on the album but idk if I like it opening the record. I like the second half but it is a weird vibe shift to the rest of the album and the first half drags a bit. Candle in the wind: classic that was immortalized in 97 but I've never been a super big fan idk it's an okay ballad. Bennie and the jets: this is where the album picks up after an interesting start. total stupid fun piano rock banger. Goodbye yellow brick road: legendary and iconic track, great lyricism and the harmony part is transcendent. this song has no title: first miss for me. bit too quirky for its own good. grey seal: good track, no notes. Jamaica jerk off: oh yeah. one of my favorites on the album for the super fun atmosphere and steel drums and great piano effect like Billy Joel's all you wanna do is dance. this might be offensive idk it's a lot of fun anyway: I've seen that movie too: a lowkey highlight of the album for me. lyrics are interesting about a failing relationship and the drama in the music and orchestration really sells it. melody and instrumentation and especially vocals are peak here.  Sweet painted lady: one of the many songs on here that has humorously provocative lyrics for those who listen closer. this one's about prostitutes but the cheery music disguises it. also  the first seconds of the album is super cool and I wish Spotify made that a seamless transition"}, "mason": {"score": 8.5, "notes": "many songs here simply aren't good but i can look past that because of the insanely lofty concept as well as some of the best prog songs scattered about"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/3e/17/ec/3e17ec6d-f980-c64f-19e0-a6fd8bbf0c10/886445635850.jpg/600x600bb.jpg", "consensus": "A massive commercial success and cultural landmark, widely acclaimed for its theatrical ambition, though some critics find it bloated and bleak."}, {"rsRank": 86, "artist": "Bruce Springsteen", "album": "Born in the U.S.A.", "year": 1984, "genre": "Rock", "own": false, "will": {"score": 7.25, "notes": "one of the most 80s sounding albums ever. not really though I guess that's more like the Peter Gabriel album. This is basically that but heartland rock instead of pop. Lyrics are really great throughout but just some of the bombastic guitar and thunderous drums on every song gets really cramped. The title track, dancing in the dark, glory days are obviously standouts. Cover me is a good one too. however the deep cuts on this album aren't really up to par. I feel like I'm giving a lot of 7s and stuff now but if you compare this album track for track with an album in the 400s it absolutely clears it. Not a bad album by any means, just wasn't produced to my liking although obviously it was to many other people's likings."}, "mason": {"score": 6.0, "notes": "cringe 80s pop but there are some good songs in here like the dark dancing one and the one about the bob jeans"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/32/72/68/327268ba-b9dd-b322-2a16-bdd0212df48c/074643865326.jpg/600x600bb.jpg", "consensus": "A massive commercial success, praised for its anthemic hooks and working-class themes, though critics note its slick '80s production."}, {"rsRank": 85, "artist": "Aretha Franklin", "album": "Lady Soul", "year"  3.0, "notes": "very boring classic punk. it was probably revolutionary at the time but listening to this nowadays it just sounds unrefined"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/71/b6/8a/71b68ab0-f2d7-5cf0-636c-c27de6ce8aed/886443520707.jpg/600x600bb.jpg", "consensus": "Widely acclaimed as a British punk landmark, praised for its urgent, politically charged energy and raw, anthemic songs."}, {"rsRank": 80, "artist": "John Lennon", "album": "Imagine", "year": 1971, "genre": "Rock", "own": true, "will": {"score": 9.25, "notes": "huge album. track by track: so much has been said about the title track I don't really need to say anything else except that it's been horribly misconstrued over the years by every celebrity on the planet to the point where all the levity has been sucked out of it which is kind of a shame but at least the message reaches some people this way. crippled inside is a fun country rocker that's a big tone shift, which happens very often on this record. the music is so juxtaposed with the lyrics it's funny and George supplies a great dobro solo. jealous guy has an undeniably good melody and chord progression, fantastic song written in India for the white album so it has to be peak. It's so hard is a goofy double entendre blues song that shifts the tone of the album a fourth time in four songs but this time it stays that way for the murky I Don't Wanna Be A Soldier Mama, which has good sax from king Curtis throughout but I have to be in the mood for this one with its weird structure where no two lines are repeated on the same beats. gimme some truth is an awesome, political song that's more relevant than ever today with a banging slide solo from George again. Oh my love is probably my least favorite track on the album as it's the least melodic of the ballads on the record and mixed super quietly. Thankfully how do you sleep is one of my favorites on the record and in John's solo career cause of how effortlessly cool the whole thing is. A diss track against Paul is unwarranted but it's interesting to hear him take down his lifelong best friend so brutally. Also the guitar tone is so dirty and the main riff that comes in halfway through the bar is so cool. (it was the inspiration for deep purple's Maybe I'm A Leo off machine head which got snubbed from this list).  The next song, How?, is an interesting spacey piano song with a nice middle eight and it's funny the way it's sequenced in the album with the prior track name. the closing track is a cool upbeat number where John calls yokos name in the middle of the night, a bath, and a shave. cool to hear him work the harmonica which is a rarity post-1965. overall the album is very politically charged but balanced with love songs when he's not fighting either his former bandmates or himself."}, "mason": {"score": 2.5, "notes": "imagine liking this record.                                  also it's commie propaganda"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music126/v4/21/e3/b0/21e3b048-c917-92c4-bd7d-ace44797b388/13UABIM52808.rgb.jpg/600x600bb.jpg", "consensus": "Widely acclaimed solo Lennon record, praised for its title track and raw, personal songwriting, though its idealism divides some critics."}, {"rsRank": 79, "artist": "Led Zeppelin", "album": "Led Zeppelin II", "year": 1969, "genre": "Rock", "own": true, "will": {"score": 9.5, "notes": "all time rock classic that heralded the entire 70s. front to back classic tracks, the only song that isn't perfect is thank you. My favorites are the lemon song and ramble on. Highlights of the album include the guitar solo in whole lotta love, the dual guitar panning in what is and what should never be, one of the best bass solos of all time in the lemon song, the segue of heartbreaker into living loving maid, and the band coming in halfway through bring it on home. Yes they stole basically every song uncredited but man this album is so fire."}, "mason": {"score": 8.5, "notes": "Pr rill, you shook me all night long, rock and roll ain't noise pollution, among others). anyway this was a foundational album for me and is front to back bangers still"}, "mason": {"score": 9.0, "notes": "every song is an instantly recognizable classic. as far as 70-80s hard rock go this is pretty much the ceiling."}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music115/v4/1e/14/58/1e145814-281a-58e0-3ab1-145f5d1af421/886443673441.jpg/600x600bb.jpg", "consensus": "A massive commercial success, widely acclaimed for its hard-rock riffs and tribute to Bon Scott, with Brian Johnson's debut vocals."}, {"rsRank": 76, "artist": "Prince and The Revolution", "album": "Purple Rain", "year": 1984, "genre": "Funk", "own": false, "will": {"score": 7.25, "notes": "super duper 80s album but not in the one man band e-drum jammy dance track way that his prior records have felt like, but in the bombastic in your face explosions and fireworks and gated snare drum that echoes for 5 seconds after every hit way. Deep cuts don't hold up, especially the ones that lean into super 80s electronics like computer blue and the beautiful ones. Side 2 is a big improvement from side 1 since it has purple rain, baby im a star, and when doves cry whereas the first sides only real banger is let's go crazy. Just kinda looking for stuff to complain about now because this record is still so much better overall than anything from the 400 range on this list"}, "mason": {"score": 7.0, "notes": "It's pretty good. the best songs are the doves one, the rain one, and the crazy one. It's noticably less horny than the other prince records  which helps for him to explore other themes like weather and ornithology"}, "coverUrl": "https://is1-ssl.mzstatic.com/image/thumb/Music211/v4/00/17/f2/0017f24f-e580-b77a-71a8-1bc7b75881bf/603497822065.jpg/600x600bb.jpg", "consensus": "Widely acclaimed Prince record, praised for its genre-blending fusion of rock, funk and pop, and its mammoth title track."}, {"rsRank": 7
